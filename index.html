<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEEEA">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<title>Japan 2026</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F7F7F7;            /* page, warm off-white */
  --surface:#FFFFFF;
  --tint:#F3F3F0;          /* chips, quiet fills */
  --line:#E6E6E1;
  --ink:#141414;
  --ink-2:#5E5E5E;
  --ink-3:#6B6B64;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 8px 22px rgba(20,18,12,.09);
  --sh-2:0 1px 2px rgba(0,0,0,.04),0 14px 34px rgba(20,18,12,.13);
  --r-s:10px;--r-m:14px;--r-l:20px;
  --c-transport:#3B82F6;--c-food:#F59E42;--c-attraction:#EF6A4C;--c-hotel:#7C6CE0;--c-shopping:#EC5A93;--c-nature:#3CB371;--c-booked:#D9A520;--c-coffee:#9C6B4A;--c-flex:#9A9A98;
  --pad:24px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html.dark{--bg:#121212;--surface:#1C1C1E;--tint:#26262A;--line:#2C2C30;--ink:#F2F2F2;--ink-2:#BDBDC2;--ink-3:#9A9AA2;--sh-1:0 2px 12px rgba(0,0,0,.45);--sh-2:0 10px 30px rgba(0,0,0,.55)}
html.dark .desc{color:#B5B5B8}html.dark .sec li{color:#C4C4C7}html.dark .guide{background:#16241B}html.dark .guide p{color:#BFD3C4}html.dark .guide p b{color:#DDEFE1}html.dark .sec.tipbox{background:#2A2414}
html.dark .img{background:#232326}html.dark .img .ph{background:linear-gradient(160deg,#232326,#1A1A1D);color:#4A4A50}
html.dark .tag.must{background:#3A1F1A;color:#F0846C}html.dark .meta .best{color:#E7C25A}html.dark .meta .best svg{color:#E7C25A}html.dark .tag.booked{background:#3A2F14;color:#E7C25A}html.dark .tag.opt{background:var(--tint);color:#5E5E5E}html.dark .st.booked{background:#173424;color:#7FD7A0}html.dark .st.tobook{background:#3A2F14;color:#E7C25A}
html.dark .fab,html.dark .garr{background:rgba(30,30,32,.9);color:#F2F2F2}html.dark .cta{background:#F2F2F2;color:#141414}html.dark .cta .d{background:rgba(0,0,0,.08)}
html.dark .dsw{background:var(--bg)}html.dark .dsw button{background:var(--surface)}
html.dark .mapbtn,html.dark .stay .acts a{background:var(--tint)}html.dark .seg{background:var(--tint)}html.dark .seg .pill{background:#3A3A40}
html.dark .nextchip,html.dark .sechead .cnt,html.dark .tag-c{background:var(--surface)}
html.dark .shade{background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 60%,rgba(0,0,0,.6) 100%)}
html.dark .credit{background:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.mapbtn:focus-visible,.cta:focus-visible{outline:3px solid #FFB84F;outline-offset:3px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;z-index:1}
.screen{display:none}.screen.active{display:block}
.hidden{display:none!important}

/* ============ image frames ============ */
.img{position:relative;overflow:hidden;background:#EDEDEA;background-size:cover;background-position:center 45%;background-repeat:no-repeat}
.img.loaded{animation:fade .35s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C2C2BD;background:linear-gradient(160deg,#EFEFEC 0%,#E4E4DF 100%)}
.img .ph svg{width:26px;height:26px}
.img .ph small{position:absolute;right:8px;bottom:6px;font-size:10px;color:#A4A4A0;font-weight:500}
.img.loaded .ph{display:none}
.img .credit{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.28);padding:2px 6px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1}
.gal .img .credit{bottom:56px;right:var(--pad)}
.daycard .img .credit,.strip .img .credit{display:none}

/* ============ overview ============ */
.ov{padding:0 var(--pad) calc(var(--sab) + 40px)}
.ov-top{padding-top:calc(var(--sat) + 28px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cd{flex:0 0 auto;text-align:center;line-height:1;background:var(--surface);border-radius:18px;box-shadow:var(--sh-1);padding:12px 16px 11px;min-width:84px;align-self:center}
.cd b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.tbtn{width:40px;height:40px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto;margin-bottom:4px}
.tbtn svg{width:18px;height:18px}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tools .mapbtn{margin:0}
.count{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600}
html.dark .count{background:#F2F2F2;color:#141414}
.ov-top h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:0}
.ov-top .sub{font-size:14px;color:var(--ink-2);margin-top:6px;font-weight:500}
.cover{margin-top:22px;border-radius:var(--r-l);height:200px;box-shadow:var(--sh-2)}
.cover .ph svg{width:32px;height:32px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag-c{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.tag-c svg{width:13px;height:13px;color:var(--ink-3)}
.h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:28px 0 12px}
.daycard{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border-radius:var(--r-l);padding:12px;box-shadow:var(--sh-1);margin-bottom:10px;position:relative}
.daycard .img{width:68px;height:68px;border-radius:12px;flex:0 0 auto}
.daycard .dt{width:50px;height:68px;border-radius:12px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;gap:2px}
.daycard .dt small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.daycard .dt b{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.daycard .today .dt,.daycard.is-today .dt{background:var(--ink);color:#fff}
.daycard.is-today .dt small,.daycard.is-today .dt b{color:#fff}
.daycard.is-past{opacity:.6}
.daycard.is-past .dt{background:var(--line)}
.daycard .img .ph svg{width:20px;height:20px}.daycard .img .ph small{display:none}
.daycard .txt{flex:1;min-width:0}
.daycard .k{font-size:11.5px;color:var(--ink-3);font-weight:500}
.daycard .t{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:3px 0 7px;color:var(--ink)}
.meta-row{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.meta-row span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meta-row svg{width:13px;height:13px;color:var(--ink-3)}
.daycard .today{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.note{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);margin-bottom:10px;overflow:hidden}
.note summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:15px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:52px}
.note summary::-webkit-details-marker{display:none}
.note summary svg{transition:transform .2s;color:var(--ink-3);flex:0 0 auto;width:18px;height:18px}
.note[open] summary svg{transform:rotate(180deg)}
.note .body{padding:0 14px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.note .body h4{margin:12px 0 5px;font-size:13px;color:var(--ink);font-weight:600}
.note .body ul{margin:0;padding-left:0;list-style:none}.note .body li{padding:3px 0}
.chk{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--ink);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:0 0 auto}
.chk input:checked+span{color:var(--ink-3);text-decoration:line-through}

/* ============ day: hero ============ */
.hero{position:relative;height:40vh;min-height:280px;max-height:400px;overflow:hidden;background:#E9E9E5}
.gal{display:flex;height:100%;overflow:visible;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.gal:active{cursor:grabbing}
.gal .img{flex:0 0 100%;height:100%}
.gal .img .credit{pointer-events:auto}
.gal .img .ph svg{width:40px;height:40px}
.gal .img .ph small{bottom:52px;right:var(--pad)}
.gal .img .ph::before{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 60%,rgba(0,0,0,.40) 100%)}
.hero .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:44px;color:#fff;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6),0 2px 14px rgba(0,0,0,.4)}
.hero .cap .k{font-size:12px;font-weight:500;opacity:.85}
.hero .cap .n{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:2px}
.gdots{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:center;gap:5px}
.gdots i{width:5px;height:5px;cursor:pointer;padding:0;box-sizing:content-box;border:6px solid transparent;background-clip:padding-box;border-radius:999px;background:rgba(255,255,255,.45)}.gdots i.on{background:#fff}
.fab{position:absolute;z-index:5;height:44px;min-width:44px;border-radius:999px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.fab.back{top:calc(var(--sat) + 12px);left:16px;width:44px}
.garr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:.9}
.garr.l{left:12px}.garr.r{right:12px}
@media (min-width:900px){.garr{width:48px;height:48px}}
.garr[disabled]{opacity:.3}
@media (hover:none) and (max-width:899px){.garr{width:34px;height:34px;top:auto;bottom:88px;transform:none;background:rgba(0,0,0,.28);color:#fff;box-shadow:none}}
.fab.pill{top:calc(var(--sat) + 12px);right:16px;padding:0 14px;font-size:13px;font-weight:600}

/* ============ day: sheet ============ */
.sheet{position:relative;z-index:2;background:var(--bg);border-radius:22px 22px 0 0;margin-top:-22px;padding:0 var(--pad) calc(var(--sab) + 100px)}
.dsw{position:sticky;top:0;z-index:6;margin:0 calc(var(--pad) * -1) 6px;padding:12px var(--pad) 22px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:var(--bg);border-radius:22px 22px 0 0}
.dsw::-webkit-scrollbar{display:none}
.dsw::after{content:"";flex:0 0 1px}
.dsw button{flex:0 0 auto;width:46px;height:50px;border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;color:var(--ink)}
.dsw button small{font-size:10.5px;font-weight:500;color:var(--ink-3);text-transform:none}
.dsw button b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dsw button.on{background:var(--accent,var(--ink));color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.tag.now{background:var(--accent,var(--ink))}
.dsw button{transition:background .3s var(--ease),color .3s,transform .18s var(--ease),box-shadow .25s}
.dsw button.on small{color:rgba(255,255,255,.6)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px;margin-bottom:14px;position:relative}
.seg button{position:relative;z-index:1;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:96px;text-align:center;transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--surface);border-radius:999px;box-shadow:var(--sh-1);transition:transform .32s var(--spring)}
.seg.b .pill{transform:translateX(100%)}
.dsw button .v{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:999px;background:var(--c-booked)}
.dsw button{position:relative}
.nextchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;padding:7px 12px 7px 8px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.nextchip .dot{width:8px;height:8px;border-radius:999px;background:#2FB35B;box-shadow:0 0 0 4px rgba(64,196,110,.18);animation:pulse 1.8s ease-in-out infinite}
.nextchip b{color:var(--ink);font-weight:600}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(64,196,110,.18)}50%{box-shadow:0 0 0 7px rgba(64,196,110,.06)}}
.nowline{position:relative;height:0;margin:0 0 12px;border-top:1.5px dashed var(--accent,var(--ink))}
.nowline::before{content:"";position:absolute;left:-33px;top:-6px;width:12px;height:12px;border-radius:999px;background:var(--accent,var(--ink));box-shadow:0 0 0 4px var(--bg)}
.nowline span{position:absolute;right:0;top:-9px;font-size:10px;font-weight:600;background:var(--accent,var(--ink));color:#fff;padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.daterow{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px;font-weight:500}
.daterow svg{width:15px;height:15px;color:var(--ink-3)}
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:6px}
.titlerow h1{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.wx{background:var(--surface);border-radius:14px;box-shadow:var(--sh-2);padding:9px 12px;display:flex;align-items:center;gap:8px;flex:0 0 auto;width:112px;margin-top:-16px;overflow:hidden}
.wx>div:first-child{min-width:0;flex:1}
.wx .t{font-size:18px;font-weight:600;line-height:1;letter-spacing:-.02em}
.wx .c{font-size:10.5px;color:var(--ink-2);margin-top:3px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx .src{font-size:10px;color:var(--ink-3);margin-top:1px}
.wx .i{font-size:24px;line-height:1;flex:0 0 auto;width:28px;text-align:center}
.desc{color:var(--ink-2);font-size:14px;line-height:1.55;margin:12px 0 20px}
.stats{display:flex;margin-bottom:20px}
.stat{flex:1;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:16px;margin-left:12px}
.stat .v{font-size:16px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.tips{display:flex;gap:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(var(--pad) * -1);padding:8px 0 22px}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:0 var(--pad);box-sizing:border-box}
.tips::-webkit-scrollbar{display:none}
.tip{flex:0 0 100%;scroll-snap-align:center;background:var(--surface);border-radius:999px;box-shadow:var(--sh-2);padding:14px 22px 14px 14px;display:flex;gap:12px;align-items:center;min-height:64px;width:100%}
.orb{display:block;flex:0 0 26px;width:26px;height:26px;border-radius:999px;background:radial-gradient(circle at 34% 28%,#CFFBD9 0%,#5DD68A 38%,#1FA35A 72%,#147A42 100%);box-shadow:0 0 0 5px rgba(64,196,110,.12),0 0 16px rgba(64,196,110,.45)}
.orb.k-wear{background:radial-gradient(circle at 34% 28%,#E6DEFF,#9B86F0 38%,#6A4FD8 72%,#4A34B0);box-shadow:0 0 0 5px rgba(124,108,224,.12),0 0 16px rgba(124,108,224,.4)}
.orb.k-food{background:radial-gradient(circle at 34% 28%,#FFE6CC,#FCAF62 38%,#EE7F2A 72%,#B85A14);box-shadow:0 0 0 5px rgba(245,158,66,.12),0 0 16px rgba(245,158,66,.4)}
.orb.k-shop{background:radial-gradient(circle at 34% 28%,#FFDDEB,#F58AB7 38%,#E4508A 72%,#B12C64);box-shadow:0 0 0 5px rgba(236,90,147,.12),0 0 16px rgba(236,90,147,.4)}
.orb.k-gem{background:radial-gradient(circle at 34% 28%,#FFF3C4,#F3C74C 38%,#D9A520 72%,#A0770C);box-shadow:0 0 0 5px rgba(217,165,32,.12),0 0 16px rgba(217,165,32,.4)}
.tip p{margin:0;font-size:13px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tip p b{color:var(--ink);font-weight:600}
.tip.x p{-webkit-line-clamp:unset}
.tip.x{border-radius:26px}
.dots{display:flex;justify-content:center;gap:4px;margin:-8px 0 26px}
.dots i{width:5px;height:5px;border-radius:999px;background:#DADAD6}.dots i.on{background:var(--ink)}
.gcount{position:absolute;right:16px;bottom:34px;background:rgba(0,0,0,.42);color:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.02em;pointer-events:none}
.gal .img .credit{bottom:34px;right:auto;left:var(--pad)}
.gtk{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad) * -1) 22px;padding:2px var(--pad) 12px}
.gtk::-webkit-scrollbar{display:none}
.gtk .g{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--sh-1);border-radius:14px;padding:9px 12px;min-width:118px;animation:rise .4s var(--ease) both}
.gtk .g:nth-child(2){animation-delay:60ms}.gtk .g:nth-child(3){animation-delay:120ms}.gtk .g:nth-child(4){animation-delay:180ms}.gtk .g:nth-child(5){animation-delay:240ms}
.gtk .g svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.gtk .g b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.gtk .g small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.hl{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:14px 16px 8px;margin-bottom:26px}
.hl .h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.hl button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--ink)}
.hl button:first-of-type{border-top:0}

/* ============ timeline ============ */
.tl{position:relative;padding-left:40px}

.tag.must{background:#FDEBE6;color:#AE3A22}.tag.booked{background:#FBF1D3;color:#7A5A08}.tag.halal{background:#E4F5EA;color:#1B6B3D}.tag.opt{background:var(--tint);color:#5E5E5E}.tag.now{background:var(--accent,var(--ink));color:#fff}
.meta{display:flex;gap:12px;margin-top:7px;font-size:12px;color:var(--ink-3);align-items:center}

.sec{margin-top:12px}

.sec.tipbox .h svg{color:#C9961C}.sec.tipbox li::before{background:#D9A520}
.mapbtn{display:inline-flex;align-items:center;gap:7px;margin-top:14px;height:44px;padding:0 16px;font-size:13px;font-weight:600;color:var(--ink);background:var(--tint);border-radius:999px}

ul.plain{margin:0;padding:0;list-style:none}

/* ============ desktop ============ */
.aside{padding:0 var(--pad) calc(var(--sab) + 100px)}

/* ============ motion & polish ============ */
:root{--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.4,.64,1)}
/* screen transitions */
.screen.active{animation:screenIn .34s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* press feedback */
.daycard,.card,.dsw button,.fab,.garr,.cta,.mapbtn,.note summary,.sechead .cnt,.tag-c,.stay .acts a{transition:transform .18s var(--ease),box-shadow .25s var(--ease),background-color .2s var(--ease),color .2s var(--ease),opacity .2s var(--ease)}
.daycard:active,.card:active,.mapbtn:active,.stay .acts a:active{transform:scale(.985)}
.dsw button:active,.fab:active,.garr:active{transform:scale(.92)}
.cta:active{transform:translateX(-50%) scale(.97)}
@media (hover:hover){
  .daycard:hover,.stay:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
  .card:hover{box-shadow:var(--sh-2)}
  .dsw button:hover:not(.on){background:#fff;box-shadow:var(--sh-2);transform:translateY(-1px)}
  .mapbtn:hover{filter:brightness(.92)}
  .stay .acts a:hover{background:#E4E4DF}
  .ql:hover{background:var(--tint)}
  .hl button:hover{background:var(--tint);border-radius:8px}
  .cta:hover{box-shadow:0 18px 40px rgba(0,0,0,.3);transform:translateX(-50%) translateY(-1px)}
  .fab:hover,.garr:hover{background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18)}
  .aside .cta:hover{transform:translateY(-1px)}
}
/* timeline stagger on day open */
.stop{animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),8) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* card expand: animated height */
.more{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;padding-top:0;border-top:1px solid transparent;transition:grid-template-rows .36s var(--ease),opacity .28s var(--ease),margin-top .3s var(--ease),padding-top .3s var(--ease),border-color .3s}
.more>.inner{overflow:hidden;min-height:0}
.stop.open .more,.stay.open .more,.mvg.open .more{grid-template-rows:1fr;opacity:1;margin-top:12px;padding-top:12px;border-top-color:var(--line)}
.chev{transition:transform .32s var(--spring),color .2s}
.stop.open .chev{color:var(--ink)}
/* tip carousel dots: active elongates */
.dots i{transition:width .3s var(--ease),background .3s}
.dots i.on{width:14px}
.gdots i{transition:width .3s var(--ease),background .3s}.gdots i.on{width:14px}
.tip{transition:border-radius .3s var(--ease),box-shadow .3s}
/* hero parallax + caption crossfade */
.gal{will-change:transform}
.hero>.gal{margin-top:var(--py,0px)}
.hero .cap{transition:opacity .25s var(--ease),transform .25s var(--ease)}
.hero .cap.sw{opacity:0;transform:translateY(4px)}
#sheetBody.sl{animation:slideL .36s var(--ease) both}#sheetBody.sr{animation:slideR .36s var(--ease) both}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes slideR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#sheetBody[data-nostagger] .stop,#sheetBody[data-nostagger] .go{animation:none}
/* sticky day row gains a shadow when stuck */
.dsw{transition:box-shadow .3s var(--ease)}
.dsw.stuck{box-shadow:0 10px 24px -14px rgba(0,0,0,.28);clip-path:inset(0 0 -40px 0)}
/* CTA hides on scroll-down, returns on scroll-up (mobile) */
.cta{transition:transform .32s var(--ease),box-shadow .25s,opacity .25s}
.cta.hide{transform:translateX(-50%) translateY(140%);opacity:0}
/* image skeleton shimmer */
.img .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.8s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.img.loaded{animation:fadeIn .5s var(--ease)}
@keyframes fadeIn{from{opacity:0;filter:saturate(.6)}to{opacity:1;filter:none}}
/* details notes body fades in */
.note[open] .body{animation:screenIn .3s var(--ease) both}
.note summary{transition:background .2s}
.note summary:active{background:var(--tint)}
/* checklist */
.chk span{line-height:1.35}
.chk span{transition:color .25s,text-decoration-color .25s;text-decoration-color:transparent}
.chk input:checked+span{text-decoration-color:var(--ink-3)}
.chk input{transition:transform .15s var(--spring)}.chk input:active{transform:scale(.85)}
/* weather crossfade */
.wx{transition:opacity .25s}.wx.sw{opacity:0}
/* typography hierarchy refinements */
.daterow{font-size:12.5px;letter-spacing:.01em;text-transform:none}
.titlerow h1{font-weight:700;letter-spacing:-.03em}
.stat .v{font-size:17px}
.stat .l{letter-spacing:.005em}
.card .nm{font-size:15px}
.tag{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;padding:3px 8px}
.meta{font-size:12.5px}
.sechead h2{font-size:18px}
.desc{color:#4A4A4A}
.sec .h{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--ink-3)}
.sec .h svg{color:var(--ink-3)}
.sec li{color:#333}
.guide p{color:#2E4A38}.guide p b{color:#173A25}
.ess h3{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--ink-3);margin:24px 0 8px}
.h2{font-size:18px}
.daycard .k{letter-spacing:.01em}
.daycard .t{font-size:15.5px}
.img .credit{font-size:9px;letter-spacing:.01em}
.stay.open .more,.mvg.open .more{margin-top:0;padding-top:0}
@media (prefers-reduced-motion:reduce){#sheetBody.sl,#sheetBody.sr{animation:none}.screen.active,.stop,.img.loaded,.note[open] .body{animation:none!important}.more,.chev,.cta,.gal{transition:none!important}.img .ph::after{display:none}}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;padding:0 14px;height:48px;margin-top:28px}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:0 0 auto}

/* ============ system-wide refinement (from the DisneySea pass) ============ */

.why{font-size:15px;line-height:1.55;color:#3A3A3A}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

  {t:'11:00',n:'Kaminarimon',best:'Late morning; come back after 19:00 lit up',go:{m:'train',t:'35 min',d:"Oedo line Kokuritsu-Kyogijo → Kuramae (no change), then 12 min walk north. Or Oedo to Aoyama-itchome, Ginza line to Asakusa, exit 1 is at the gate"},p:'kaminarimon',cat:'attraction',key:true,guide:"Stand under the lantern and look up: the dragon carved into its base is what everyone walks past.",must:true,m:'The giant red lantern is the entrance to Asakusa and the classic first photo.',see:['Look up under the lantern: there is a carved dragon on its base','The god statues either side, Fujin (wind) and Raijin (thunder)'],tip:['Kappabashi kitchen street is 10 minutes west: knives engraved while you wait at Kama-Asa, and the plastic food replicas','Shoot from across the road with the lantern centred and Nakamise running behind it']},
  {t:'11:30',n:'Nakamise-dori',go:{m:'walk',t:'1 min',d:"Straight through the gate"},p:'nakamise',cat:'shopping',guide:"Kagetsudo's jumbo melon pan is one lane west of the stalls. Eat it warm, the queue moves in five minutes.",m:'About 250 m of stalls between the gates, roughly 90 shops. Stalls open around 10:00.',eat:['Age-manju (fried sweet bun) with matcha or custard filling','Ningyo-yaki, tiny sponge cakes shaped like the lantern and pigeons','Kibi dango skewers','Melon pan from Kagetsudo, one street over'],buy:['Tenugui hand towels','Folding fans','Chopsticks','Maneki-neko','Small ceramics'],tip:['No walking while eating here, stand to the side of the stall']},
  {t:'12:00',n:'Senso-ji',go:{m:'walk',t:'4 min',d:"Along Nakamise to the Hozomon gate"},p:'sensoji',cat:'attraction',key:true,guide:"Draw an omikuji for ¥100. Senso-ji is famous for handing out bad fortunes, so tie it to the rack and walk off laughing.",must:true,m:'Tokyo\'s oldest temple, founded in 628. The grounds never close and the main hall opens from 06:00.',see:['Hozomon gate with the giant straw sandals on the back','Five-storey pagoda','The incense burner: waft smoke over yourself for good health','Omikuji fortune for ¥100, tie a bad one to the rack and leave it behind','Skytree framed above the temple roofs from the west side'],tip:['Come back after 19:00 if you can, the whole complex is lit and nearly empty']},
  {t:'13:00',n:'Lunch: CANOW wagyu skewers',go:{m:'walk',t:'5 min',d:"West of the temple in the back lanes off Denboin-dori"},p:'halalya',cat:'food',key:true,guide:"Order the skewer over the burger, then buy the curry retort packs next door. You will not find them elsewhere.",m:'A tiny wagyu counter by the Nakamise back lanes. Next door is a Japanese food gift shop with 130+ products worth a browse.',eat:['Wagyu skewer','Wagyu burger','Japanese curry retort packs to take home'],buy:['Japanese snacks and sauces as gifts']},
  {t:'14:30',n:'Sumida River walk',go:{m:'walk',t:'8 min',d:"East from the temple to the river and Azumabashi bridge"},p:'sumida',cat:'nature',guide:"Cross Azumabashi and shoot back toward Asakusa with the golden flame on the Asahi building in frame. Locals call it the golden turd.",m:'Cross to the east bank for the postcard shot of Skytree with the Asahi flame.',see:['Sumida Park riverside','Azuma-bashi bridge view','Yokoami side streets'],tip:['The Tokyo Mizumachi walkway under the rail tracks leads to Skytree in 20 minutes on foot']},
  {t:'16:00',n:'Tokyo Skytree',go:{m:'walk',t:'20 min',d:"Over Azumabashi and along the Mizumachi walkway, or Tobu Skytree line one stop from Asakusa"},p:'skytree',cat:'flex',opt:true,m:'Only if the group really wants the panorama. Otherwise save the time and legs.',tip:['Book the Tembo Deck online to skip the queue if you do go']},
  {t:'18:00',n:'Shibuya Crossing',best:'18:00 to 20:00, peak crowd; rain makes it better',go:{m:'train',t:'35 min',d:"Ginza line from Asakusa, direct to Shibuya, one train, about ¥260. Hachiko exit puts you at the crossing"},p:'shibuya',cat:'attraction',key:true,guide:"If you cannot get a sunset slot at Shibuya Sky, Mag's Park on top of 109 is ¥600 and looks straight down the crossing.",must:true,m:'Busiest between 18:00 and 20:00, and rain makes it better: a sea of umbrellas from above.',see:['Hachiko statue by the station exit','Cross it once, then watch from above','Mag\'s Park rooftop on Shibuya 109 for the cheapest overhead view','Shibuya Sky for the big one: sunset slots sell out weeks ahead','Miyashita Park rooftop and Nonbei Yokocho alley'],buy:['Sneakers and streetwear along Center-gai','Character goods at Shibuya Parco'],tip:['Shoot the crossing from the Starbucks window on the second floor of Tsutaya or the JR walkway']},
  {t:'19:30',n:'Dinner: GYUMON Shibuya',go:{m:'walk',t:'6 min',d:"Off Dogenzaka, two blocks from the crossing. Back to the hotel afterwards: JR Yamanote to Shibuya → Yoyogi, Sobu line to Sendagaya, 12 min, then 5 min walk; or taxi 10 min"},p:'gyumon',cat:'food',guide:"Ask for the tasting set so you get three cuts. The tongue is the sleeper hit.",must:true,m:'Wagyu yakiniku with a wagyu ramen branch one minute from the station.',eat:['A5 wagyu yakiniku set','Wagyu ramen','Gyukatsu'],tip:['Reserve, it fills up on Thursday and Friday nights']},
  {t:'21:00',n:'Shibuya after dark: Nonbei Yokocho and Center-gai',p:'nonbei',cat:'attraction',go:{m:'walk',t:'5 min',d:"Nonbei Yokocho is the lantern alley squeezed against the tracks north of the station; Center-gai is back across the crossing"},m:'Two lanes of tiny bars under the railway, then the neon canyon. Photos and atmosphere; nobody needs to drink.',see:['Nonbei Yokocho lanterns','Center-gai at full volume','Miyashita Park rooftop, open until 23:00']},
  {t:'22:15',n:'MEGA Don Quijote browse',p:'donki',cat:'shopping',opt:true,go:{m:'walk',t:'5 min',d:"Up Dogenzaka from the crossing. Open 24 hours; the big shop is on the 18th, tonight is a look"},m:'A first look so the 18th is fast. Buy nothing heavy.',guide:"Walk all six floors once now and you will know exactly what to grab on the last day."},
  {t:'23:00',n:'Home: JR or taxi',p:'hotel',cat:'hotel',go:{m:'train',t:'15 min',d:"JR Shibuya → Yoyogi → Sendagaya runs until about 00:30. Taxi is 10 min, roughly ¥1,500"},m:'Last trains on most Tokyo lines are between 00:00 and 00:30; after that it is taxis.'}],
 ess:{wear:['Breathable tee','Light overshirt','Trousers','Walking shoes','Compact umbrella'],eat:['Wagyu skewer','Age-manju','A5 yakiniku'],buy:['Tenugui','Fans','Maneki-neko','Snacks from the Asakusa gift shop']}},

{id:'oct09',n:3,d:'Friday, 9 October',short:'Fri 9 Oct',title:'Tokyo DisneySea',hero:['medharbor','rapunzel','indiana','ragingspirits','mysterious','fantasy'],mode:'transit',wx:{t:23,c:'Cloudy',i:'🌥️',ll:[35.63,139.88]},
 desc:'Friday in Halloween season during the 25th anniversary: expect an 8-out-of-10 crowd day. Priority rides, in order: Frozen Journey, Peter Pan, Rapunzel, Journey to the Center of the Earth. If crowds cost you anything, cut everything else first. The day is built around Rapunzel first thing and again at night; then a rope-drop sprint for the rides you cannot buy your way onto cheaply, paid Premier Access for Fantasy Springs, free Priority Passes for the second tier, shows and indoor ports in the 12:00 to 15:00 crush, and the big rides again in the last 90 minutes when waits collapse.',
 stats:[['06:00','Wake'],['15 to 20k','Steps']],
 tips:[{k:'tip',h:'Four rides matter: Frozen, Peter Pan, Rapunzel, Journey. Everything else is a bonus.',t:'Minute one: Premier Access for Frozen. 10:00: Premier Access for Peter Pan. Rapunzel on rope-drop standby at 09:20. Journey on standby before lunch or as a third paid pass. That covers all four by 15:40 even on a bad day.'},{k:'tip',h:'Take the free Indiana Jones pass at minute two anyway.',t:'It costs nothing and gives you a fifth ride without a queue if the day goes well.'},{k:'tip',h:'Be at the gates 07:30 for a 09:00 opening.',t:'Gates usually open 15 to 30 minutes early on busy days. The first 40 minutes are the cheapest rides of the day: walk straight to Soaring.'},{k:'wear',h:'Comfortable shoes, tee and light layer, light waterproof shell, cap.',t:'Thin spare socks in the bag. Small bag only, security opens everything.'},{k:'food',h:'Mobile Order everything.',t:'Order lunch from the app at 11:00 for a 13:30 pickup and skip the queue. Sweets and popcorn are the safe snacks; hot food is pork-heavy.'},{k:'shop',h:'Buy only DisneySea-exclusive things here, and buy them after 19:00.',t:'Emporio by the exit needs a Standby Pass at peak; the themed shops thin out at night.'},{k:'gem',h:'Fortress Explorations and 20,000 Leagues have no queue worth mentioning.',t:'Both are best after dark: the fortress for the harbour lights, the submarine for the glow.'}],
 stops:[
  {t:'06:00',n:'Wake, breakfast, leave hotel by 06:40',p:'hotel',cat:'hotel',go:{m:'walk',t:'',d:"Konbini breakfast bought last night. Charge the phone to 100 percent; the app runs all day"},m:'Power bank, tickets in the app, small bag.'},
  {t:'07:30',n:'At the gates',p:'disney',cat:'transport',key:true,best:'07:30 for a 09:00 opening; gates often open 08:30',go:{m:'train',t:'50 min',d:"Sobu line Sendagaya → Ochanomizu, Chuo rapid → Tokyo Station, then JR Keiyo line to Maihama, 16 min. The Keiyo platforms are a 10-minute walk underground inside Tokyo Station. From Maihama, Resort Line monorail one stop or a 10-minute walk"},m:'Join the entry lines to the right of the centre; they move at the same speed and are shorter. Have all three ticket QR codes ready on one phone.',see:['Look up as you scan in: the AquaSphere globe fountain is the classic first photo','Halloween banners along the entrance passage','Mediterranean Harbor as you enter, empty for the only time today'],guide:"Scan in, stop walking, open the app. Nothing else happens until the first Premier Access is bought.",tip:['Toilets are just inside the gate on the right; the next quiet ones are under the Soaring museum','Lockers by the entrance (¥400 to ¥800) for the rain shell and anything you do not need until dark','Guest Relations to the left inside the gate for the paper map and show times if the app is slow']},
  {t:'09:00',n:'Passes in the app, then straight to Fantasy Springs',p:'medharbor',cat:'booked',go:{m:'walk',t:'14 min',d:"Scan in, stop, buy the pass, then walk fast: left along the harbour, through the Mysterious Island tunnel, out the far side into Mermaid Lagoon, keep the water on your right through Arabian Coast and Lost River Delta, over the wooden bridge and through the rock archway into Fantasy Springs. Rapunzel is the first ride on the right"},m:'Premier Access: Anna and Elsa\'s Frozen Journey, earliest slot, ¥2,000 each. Priority Pass (free): Indiana Jones. Then walk, do not stop, to Fantasy Springs. Rapunzel is the ride the day is built around and its standby is shortest in the first 30 minutes.',tip:['Second paid pass at 10:00: Peter Pan, so both Fantasy Springs headliners are guaranteed','Third paid pass in the afternoon if Journey standby is over 60: ¥2,000 well spent for a priority ride','If the app offers Rapunzel Premier Access with a slot before 11:00, buy it as the first pass instead and take Frozen second'],guide:"Everyone else runs to Soaring at rope drop. You run east. Fantasy Springs at 09:15 is the emptiest it will be all day."},
  {t:'09:20',n:'Rapunzel\'s Lantern Festival, first ride of the day',must:true,p:'fantasy',cat:'attraction',key:true,best:'First 30 minutes after opening, then again after 19:00',go:{m:'walk',t:'',d:"Entrance under the tower, standby lane on the right"},m:'Priority ride number three, and the one the day is built around. The Tangled boat ride: through the forest, past the Snuggly Duckling, into the lantern room where the lanterns rise around the boat to "I See the Light". About 7 minutes, no drops, no height limit. Standby 20 to 40 at this hour, 60 to 90 by lunch.',see:['Rapunzel\'s tower rising over the forest, best from the bridge at the port entrance','Snuggly Duckling tavern facade and the courtyard beside it','Flynn and Rapunzel meet-and-greet spots along the path, check the app for times'],eat:['Snuggly Duckling: sweet pastries and donuts, quick counter'],buy:['Fantasy Springs Gifts: Rapunzel lantern merchandise is port-exclusive; a Standby Pass may be required at peak, so shop here late if the app says so'],tip:['Sit at the front of the boat for the clearest lantern room','Ride it again at 19:30 when standby drops under 30; the lantern room at night feels different','Phones fine, no flash, the boat is slow'],guide:"The lantern room is the payoff. Phones down for the first ride, the lanterns rise around you for about a minute and no photo comes close. Film it on the second ride."},
  {t:'09:50',n:'Peter Pan\'s Never Land Adventure',must:true,p:'fantasy',cat:'attraction',go:{m:'walk',t:'3 min',d:"Follow the springs path clockwise; the pirate ship and Skull Rock mark the Never Land side, entrance under the rock arch"},m:'Priority ride number two. 3D flying boat ride, about 6 minutes. Standby is 40 to 60 this early and 90 to 150 by lunch: ride it now if the line is under 45, and buy it as the 10:00 Premier Access regardless so it is guaranteed.',see:['Fairy Tinker Bell\'s Busy Buggies next door: standby only, 30 to 60 min, skip unless queues are short','The Lost Boys hideout play area beside the ride'],tip:['3D glasses; take them off if the motion bothers anyone']},
  {t:'10:45',n:'Soaring: Fantastic Flight',p:'medharbor',cat:'attraction',key:true,best:'Rope drop or the last hour; midday is the longest line in the park',go:{m:'walk',t:'14 min',d:"Back out through the archway and west along the water to Mediterranean Harbor; Soaring is the domed museum at the far end of the harbour. Or Transit Steamer from the Lost River Delta dock"},m:'Flying theatre over world landmarks, 4 min 50 sec, 102 cm minimum. Use the second Premier Access bought at 10:00 if the standby is over 60; otherwise save it for the last hour when it drops to 30 to 45.',tip:['Ask for row 1: no feet in frame','Nothing to hold, bags go in the pouch under the seat'],eat:['Cafe Portofino nearby for a pastry if anyone skipped breakfast'],guide:"Row 1 gets the cleanest view with no feet in frame. Ask when you are being seated."},
  {t:'11:40',n:'Journey to the Center of the Earth',must:true,p:'mysterious',cat:'attraction',key:true,go:{m:'walk',t:'5 min',d:"From Soaring turn right along the harbour and take the stone tunnel into Mysterious Island. Inside the caldera, the entrance is on your left at the base of Mount Prometheus, past the Nautilus on the water"},m:'Priority ride number four. DisneySea\'s signature thrill: 3 minutes, one big drop and a 75 km/h burst out of the volcano, 117 cm minimum. Standby 60 to 120 at this hour; join it if under 60, otherwise buy it as the third Premier Access (¥2,000) for an afternoon slot.',see:['Mount Prometheus erupting on the hour','The drill-vehicle finale bursts out of the mountain; watch one from the bridge before you ride'],eat:['Vulcania Restaurant inside the volcano: Chinese-style set meals, some with pork; ask','Nautilus Galley by the water: the gyoza dog here is pork, so skip; the drinks are fine'],tip:['Secure hats and phones before boarding']},
  {t:'12:45',n:'20,000 Leagues Under the Sea',p:'mysterious',cat:'attraction',go:{m:'walk',t:'2 min',d:"Straight across the caldera; the entrance is in the rock wall opposite, with the Refreshment Station beside it"},m:'Slow dark submarine ride, waits rarely over 25 minutes. A calm one before the walk east.',guide:"Sit on the side facing away from the loading dock; the windows on that side get the giant squid.",eat:['Refreshment Station by the exit: Tipo Torta, the chocolate-cream pastry stick that regulars queue for'],tip:['5 min, no height limit, dark and slow; sit on the side facing away from the loading dock']},
  {t:'13:15',n:'Lunch in Fantasy Springs (Mobile Order)',p:'fantasy',cat:'food',go:{m:'walk',t:'12 min',d:"East again from Mysterious Island: Mermaid Lagoon, Arabian Coast, Lost River Delta bridge, through the archway. Lookout Cookout is the wooden fort beside Peter Pan; Royal Banquet of Arendelle is across the springs by the ice palace"},m:'Arendelle Royal Banquet is the sit-down one with the castle interior; Lookout Cookout is the quick burgers-and-fries counter. Check the menu boards: most chicken and beef items are fine, sausages and bacon dishes are pork.',eat:['Lookout Cookout burger','Snuggly Duckling donuts','Frozen-themed cakes at Oaken\'s OK Foods'],see:['Arendelle village facades and the ice palace across the water while you wait for the order']},
  {t:'14:15',n:'Mermaid Lagoon: indoors while the park peaks',p:'disney',cat:'attraction',go:{m:'walk',t:'8 min',d:"Back out of Fantasy Springs through the archway, retrace along Lost River Delta and Arabian Coast; Mermaid Lagoon is the giant pink shell building, enter under King Triton castle"},m:'The whole port is inside, air-conditioned and aimed at kids, which means empty at 14:00 on a hot day. Sit, cool down, ride Flounder\'s coaster if the line is short. Mermaid Lagoon Theater takes the free Priority Pass.',guide:"Nobody over twelve rides Jumpin\' Jellyfish, and that is exactly why it is a five-minute wait and quietly wonderful.",see:['Flounder\'s Flying Fish Coaster (short, gentle)','Scuttle\'s Scooters','Blowfish Balloon Race','Jumpin\' Jellyfish','The Whirlpool teacups','Ariel\'s Playground for a wander','Mermaid Lagoon Theater: the Ariel musical, free Priority Pass or a short line'],eat:['Sebastian\'s Calypso Kitchen: pizza and calzone, check the toppings','Sea salt ice cream monaka from the cart outside the lagoon'],tip:['Toilets and the quietest baby-care room in the park are here, use them now','Flounder coaster is 90 cm minimum and 60 seconds']},
  {t:'15:00',n:'Arabian Coast: Sindbad and the Magic Lamp Theater',p:'disney',cat:'attraction',go:{m:'walk',t:'4 min',d:"Out of the lagoon, turn left; Sindbad is the boat ride in the domed building on the water side, Magic Lamp Theater is across the courtyard by the Caravan Carousel"},m:'Sindbad\'s Storybook Voyage is a 10-minute boat ride with a 10-minute wait and one of the best songs in any Disney park. Magic Lamp Theater takes the free Priority Pass if any are left.',see:['Jasmine\'s Flying Carpets, 5 to 15 minutes','The Genie 3D show at Magic Lamp Theater, one of the funniest things in any Disney park','Sultan\'s Oasis courtyard at golden hour','Caravan Carousel, two storeys, no wait'],guide:"Sindbad is the sleeper of the whole park. Locals ride it twice. Do not skip it for a big-name queue.",eat:['Casbah Food Court: curry sets with chicken or beef, naan; the most reliable proper meal in the park','Open Sesame cart: churros in Arabian flavours'],buy:['Agrabah Marketplace for lamp and carpet themed gifts']},
  {t:'15:40',n:'Anna and Elsa\'s Frozen Journey (Premier Access slot)',must:true,p:'fantasy',cat:'booked',key:true,go:{m:'walk',t:'10 min',d:"Same route east as before: Lost River Delta bridge, through the Fantasy Springs archway, then left around the springs to the ice palace. Premier Access entrance is the marked lane to the left of the standby line"},m:'Priority ride number one. Boat, two drops, the full soundtrack. Standby runs 120 to 240 on a day like this, so this is your paid slot; the time shown is an example, your app window is the real one.',guide:"Boarding on the right side of the boat gets Elsa\'s ice palace straight on. Ask for right when they seat you.",see:['Oaken\'s cabin and sauna gag at the ride exit','Elsa\'s ice palace lit from inside after 17:00'],eat:['Royal Banquet of Arendelle if you skipped the earlier lunch: sit-down inside the castle, Mobile Order','Oaken\'s OK Foods: Frozen-themed cakes and drinks'],tip:['Boat ride with two drops, about 6 min; a little splash at the front rows','Right side of the boat for the ice palace']},
  {t:'16:30',n:'Lost River Delta: Indiana Jones (Priority Pass) and Raging Spirits',p:'indiana',key:true,cat:'attraction',go:{m:'walk',t:'8 min',d:"Back over the Fantasy Springs archway; Indiana Jones is the temple on the right, Raging Spirits the coaster behind it, single-rider entrance at the far left of the temple plaza"},m:'Indiana Jones on your morning Priority Pass. Raging Spirits (the loop coaster) has a single-rider line that cuts a 60-minute wait to 15 if you do not mind splitting up.',tip:['Indiana Jones: 3 min jeep ride, 117 cm minimum, rough and fast, glasses off','Raging Spirits: 90-second coaster with a full loop, 117 cm minimum, nothing loose','Raging Spirits single rider: ask the attendant at the entrance for the single-rider queue'],guide:"Raging Spirits single rider is the best trade in the park: three of you walk on in ten minutes and reunite at the exit.",see:['The Transit Steamer dock here for the ride back to the harbour','Halloween decorations are thick around the temple'],eat:['Yucatan Base Camp Grill: smoked turkey leg, the big meaty snack that is not pork','Curry popcorn cart by the temple','Miguel\'s El Dorado Cantina: Mexican plates']},
  {t:'17:15',n:'Sunset at Mediterranean Harbor',p:'medharbor',cat:'nature',best:'Sunset 17:10; claim a harbour spot by 17:00 for the evening show',go:{m:'boat',t:'12 min',d:"Transit Steamer dock is at the Lost River Delta waterfront by the cantina; boats to Mediterranean Harbor every 10 to 15 minutes. Get off at the harbour and walk to the Fortress side by the galleon"},m:'Take the steamer, sit down, watch the lights come on. Pick your spot for the evening harbour show on the Fortress Explorations side, which fills later than the hotel side.',see:['Fortress Explorations: climb the galleon, the observatory, the map room; no queue','Zambini Brothers\' Ristorante terrace for a coffee with the harbour view','DisneySea Electric Railway from American Waterfront to Port Discovery, 5 minutes, a nice sit-down','Venetian gondolas','Fortress Explorations galleon','Mount Prometheus lit at night'],eat:['Black pepper popcorn cart on the harbour','Mickey ice bar from any cart']},
  {t:'18:00',n:'Tower of Terror, then Toy Story Mania',p:'disney',cat:'attraction',best:'After 19:00 waits drop by half',go:{m:'walk',t:'8 min',d:"Along the harbour past the Zambini terrace and the ocean liner into American Waterfront; the tower is the tall brown Hotel Hightower, Toy Story Mania is the pier building behind it"},m:'Both run 60 to 120 by day and 30 to 45 after the evening show starts. Premier Access ¥1,500 each if you would rather not gamble. Turtle Talk next door takes the free pass and is a good sit-down.',guide:"Ride Tower of Terror during the harbour show itself. Everyone is watching the water and the line halves.",see:['S.S. Columbia ocean liner: walk the decks, free, and the Teddy Roosevelt Lounge inside','Big City Vehicles: ride a vintage car around the port for the price of a short queue','Cape Cod: Duffy & Friends village with the lighthouse; the Duffy show plays here by lottery','Turtle Talk with Crush: free Priority Pass or 20-minute line, a sit-down that is funnier than it sounds','Port Discovery next door: Aquatopia (10 to 20 min, ride the wet side if warm) and Nemo & Friends SeaRider (free pass or 30 to 60)'],eat:['Cape Cod Cook-Off: burgers, and the Duffy-themed desserts','Caramel popcorn at Cape Cod, garlic shrimp popcorn on the Waterfront','Seaside Snacks in Port Discovery for the sea salt monaka if you missed it'],buy:['McDuck\'s Department Store and Steamboat Mickey\'s on the Waterfront for the widest general range','Cape Cod shop for Duffy, ShellieMay, Gelatoni, StellaLou, CookieAnn, LinaBell'],tip:['Tower of Terror: 2 min, 102 cm minimum, three drops; hold the bag','Toy Story Mania: 3D shooter, no height limit, compete for the highest score']},
  {t:'19:30',n:'Evening harbour show and Halloween atmosphere',p:'medharbor',cat:'attraction',key:true,go:{m:'walk',t:'5 min',d:"Back along the waterfront to your harbour spot; keep the S.S. Columbia on your left"},m:'The 25th anniversary night show on the water, then Mount Prometheus and the harbour lit up. Halloween decorations are heaviest around Mediterranean Harbor and American Waterfront.',see:['Halloween daytime harbour show: check the app for the afternoon time and catch it from the same spot if the schedule allows','Big Band Beat if the lottery came through: 30-minute live jazz at the Broadway Music Theatre','The volcano, the fortress and the hotel MiraCosta all lit: the best night skyline in either park','Night show from the Fortress side','Halloween-lit Cape Cod lighthouse'],guide:"Stay ten minutes after the show ends. The crowd drains toward the exit and the harbour is yours for photos."},
  {t:'20:15',n:'Last rides: Rapunzel again, or Soaring',p:'fantasy',cat:'attraction',must:true,best:'Final hour, lines under 30',go:{m:'walk',t:'14 min',d:"For Rapunzel: east through the ports to Fantasy Springs one last time, the path is lit and empty. For Soaring: 3 minutes along the harbour to the museum dome"},m:'Standby on everything drops to 20 to 45 minutes in the final hour. The plan is Rapunzel a second time with the lanterns at night; you can join a standby line until park close and will still ride.',guide:"Second Rapunzel ride is the one to film. The queue is short, the port is dark, and the lantern room lands harder at night."},
  {t:'20:45',n:'Merchandise on the way out',p:'disney',cat:'shopping',go:{m:'walk',t:'3 min',d:"Emporio is the big arcade on the left as you walk back to the entrance plaza; Galleria Disney is beside the AquaSphere"},m:'Buy now, not at midday. Bags are checked at the exit at closing, expect a shuffle.',buy:['Emporio: the biggest shop, everything general','Galleria Disney: pins and 25th anniversary items','Il Postino Stationery: the postcard and stationery shop nobody notices, next to the entrance','Duffy & Friends (Cape Cod shop, or Emporio)','Halloween and 25th anniversary exclusives','Pins, popcorn bucket, mugs']},
  {t:'21:30',n:'Dinner near Tokyo Station, then home',cat:'food',go:{m:'train',t:'50 min',d:"Keiyo line to Tokyo Station, 16 min; eat in the station (Ramen Street, Kitchen Street) then Sobu to Sendagaya. Or taxi from Maihama, 40 min, about ¥9,000"},m:'Everyone leaves at 21:00; the Keiyo platform is a crush for 20 minutes. Buy a drink, sit, let the first two trains go.'}],
 ess:{wear:['Comfortable shoes','Tee + light layer','Waterproof shell','Cap','Spare socks','Small bag only'],eat:['Popcorn bucket (curry at Lost River, black pepper at the harbour)','Sea salt ice cream monaka','Lookout Cookout burger','Snuggly Duckling donuts'],buy:['Duffy & Friends','Halloween exclusives','25th anniversary pins','Popcorn bucket']}},

{id:'oct10',n:4,d:'Saturday, 10 October',short:'Sat 10 Oct',title:'Tokyo → Kyoto',hero:['tokyost','arashiyama','togetsukyo'],mode:'transit',wx:{t:24,c:'Mild',i:'🌤️',ll:[35.01,135.77]},
 desc:'Checkout sweep, ekiben at Tokyo Station, Shinkansen west. Settle into Arashiyama with the bridge and bamboo on your doorstep, then Hankyu into town for the arcades and dinner.',
 stats:[['08:00','Checkout'],['2h 15m','Shinkansen']],
 tips:[{k:'tip',h:'Luggage plan: message the Forestage host today about a bag drop before 15:00.',t:'If it is no, use the large lockers at Kyoto Station (¥700) and collect them at 17:00 on the way into town.'},{k:'tip',h:'Sit on the right side (seats D or E) Tokyo → Kyoto for Mount Fuji.',t:'About 40 minutes in, around Shin-Fuji. Clear mornings only.'},{k:'food',h:'Ekiben at Ekiben-ya Matsuri, Gransta, inside Tokyo Station.',t:'170-odd kinds. Buy before boarding, eat once the train moves.'},{k:'gem',h:'Kyoto Station has a rooftop Skyway.',t:'Free, 45 m up, over the big staircase. Ten minutes on arrival if the Shinkansen was on time.'},{k:'shop',h:'Teramachi tonight, Nishiki tomorrow at 14:00.',t:'Nishiki stalls close 17:00 to 18:00, which is why it moved to the 11th.'},{k:'wear',h:'Long sleeve, light jacket, comfortable travel shoes.',t:''}],
 stops:[
  {t:'08:00',n:'Breakfast and Tokyo checkout',p:'hotel',cat:'hotel',go:{m:'walk',t:'',d:"Ask reception to call a taxi for 09:20 if bags are heavy"},m:'Full sweep: passport, chargers, wallet, key card, Disney bags, under the bed.'},
  {t:'09:40',n:'Tokyo Station',p:'tokyost',cat:'transport',key:true,go:{m:'train',t:'25 min',d:"Sobu line Sendagaya → Ochanomizu, Chuo rapid → Tokyo, about 20 min plus stairs. With three suitcases a taxi is 20 to 25 min, roughly ¥3,000, and drops you at the Yaesu Shinkansen side"},m:'Find the Tokaido Shinkansen gates first, then food. Allow 45 minutes.',eat:['Ekiben (rice-box bento)','Green tea in the pull-cord can','Tokyo Banana as a gift'],see:['Marunouchi red-brick facade from outside','Character Street in the basement'],guide:"Ekiben-ya Matsuri opens at 05:30. Get the beef tongue bento, and a hot tea from the platform machine, the cans come warm."},
  {t:'10:40',n:'Shinkansen to Kyoto',cat:'booked',go:{m:'train',t:'2h 15m',d:"Nozomi, reserved seats. Suitcases over 160 cm total need the oversized-baggage seats at the back of the car, booked with the ticket"},m:'Sit on the right, seats D or E, for Fuji about 40 minutes in.'},
  {t:'12:55',n:'Arrive Kyoto Station',p:'kyotost',cat:'transport',go:{m:'walk',t:'',d:"Follow signs for JR Sagano (San-in) line, platforms 31 to 33 at the far west end, 8 min walk inside the station"},m:'Big station. Kyoto Tower is straight outside the central exit.',guide:"Ride the escalators to the rooftop Skyway. Free, and the big staircase lights up at night."},
  {t:'13:20',n:'JR Sagano line to Saga-Arashiyama',p:'sagaarashiyama',cat:'transport',go:{m:'train',t:'16 min',d:"Local or rapid, every 10 to 15 min, ¥240. Then a 13-minute walk south to the apartment, or a taxi from the station rank, 5 min, about ¥900"},m:'Coin lockers at Saga-Arashiyama are few; Kyoto Station lockers (¥700 large) are the fallback if the host cannot take bags early.'},
  {t:'13:50',n:'Drop bags at Forestage Arashiyama',p:'airbnb',cat:'hotel',go:{m:'walk',t:'13 min',d:"Cross the Katsura River road and walk toward Hankyu Arashiyama Station; the apartment is one minute from it"},m:'Message the host a day ahead to leave luggage before the 15:00 check-in. If not possible, lockers at Kyoto Station and come back for them at 17:00.'},
  {t:'14:10',n:'Lunch: Wagyu Donburi-ya Nikuni',p:'nikuni',cat:'food',go:{m:'walk',t:'5 min',d:"On the Arashiyama main street between the two stations"},m:'The wagyu rice bowl place two minutes from the apartment. Ask which bowls are beef only.',eat:['Wagyu don','Beef sukiyaki bowl']},
  {t:'15:00',n:'Check-in and settle',p:'airbnb',cat:'hotel',go:{m:'walk',t:'5 min',d:""},m:'Find the Ministop (120 m), the Kawakatsu supermarket (750 m) and the washing machine.'},
  {t:'15:40',n:'Togetsukyo Bridge and riverside',best:'Late afternoon light on the hills',p:'togetsukyo',cat:'nature',key:true,must:true,go:{m:'walk',t:'3 min',d:"The bridge is at the end of the street"},m:'The Arashiyama postcard: wooden bridge, river, wooded hills.',see:['Bridge from the south bank','Boats for hire on the river','% Arabica on the north bank'],guide:"Stand on the bridge at night and look upstream. The hills are lit and nobody is there."},
  {t:'16:15',n:'Tenryu-ji and the Bamboo Grove',p:'arashiyama',cat:'attraction',key:true,must:true,go:{m:'walk',t:'8 min',d:"North across the bridge, past the shops on the main street; grove entrance is beside Tenryu-ji's north gate"},m:'Tenryu-ji garden closes at 17:00 (last entry 16:50), the grove path is open always. Late afternoon light is good; it is busy but you are here again at dawn on the 15th.',see:['Tenryu-ji Sogenchi pond garden','Bamboo Grove path','Nonomiya shrine'],guide:"Enter the grove from the Nonomiya shrine side and walk to the Okochi Sanso gate. By nine in the morning it is a queue, right now it is a crowd; dawn on the 15th is the real one.",tip:['Community pick: keep walking past the grove exit to Okochi Sanso (¥1,000 with matcha); the path beyond it to Gio-ji and Otagi Nenbutsu-ji is the Arashiyama nobody sees']},
  {t:'17:30',n:'Hankyu to Kyoto-Kawaramachi',p:'kawaramachi',cat:'transport',key:true,go:{m:'train',t:'17 min',d:"Hankyu Arashiyama line to Katsura (7 min), cross the platform to the Kyoto line, 10 min to Kawaramachi, ¥240. Every 10 min"},m:'Exit 9 or 10 puts you on Shijo street.'},
  {t:'18:00',n:'Teramachi and Shinkyogoku arcades',p:'teramachi',cat:'shopping',go:{m:'walk',t:'4 min',d:"North from Shijo, the two covered arcades run side by side"},m:'Open until 20:00 or later. Nishiki market next door is shut by now; it is on tomorrow at 14:00.',buy:['Kyukyodo for incense and washi stationery','Vintage kimono shops','Capsule toys'],see:['Nishiki Tenmangu shrine at the arcade junction'],guide:"Kyukyodo on Teramachi for incense and washi. The upstairs floor is where the good stuff is."},
  {t:'19:00',n:'Dinner: Istanbul Saray or Raju',p:'saray',cat:'food',key:true,go:{m:'walk',t:'6 min',d:"Both are within a few blocks of Kawaramachi and Sanjo"},m:'Turkish or Indian, both a short walk from Kawaramachi.',eat:['Turkish mixed grill and pide at Saray','Butter chicken and naan at Raju'],guide:"Saray's mixed grill for two feeds three. Raju's butter chicken is the safer bet if anyone is tired."},
  {t:'20:30',n:'Hankyu back to Arashiyama',p:'hankyuarashiyama',cat:'transport',key:true,go:{m:'train',t:'17 min',d:"Kyoto line to Katsura, Arashiyama line to the end. Last trains around 23:30"},m:''}],
 ess:{wear:['Long sleeve','Light jacket','Travel shoes'],eat:['Ekiben','Wagyu don at Nikuni','Turkish grill'],buy:['Kyukyodo incense','Vintage kimono','Capsule toys']}},

{id:'oct11',n:5,d:'Sunday, 11 October',short:'Sun 11 Oct',title:'Classic Kyoto',hero:['fushimi','kiyomizu','nishiki','gion'],mode:'transit',wx:{t:23,c:'Cloudy',i:'⛅',ll:[34.99,135.78]},
 desc:'Your big cultural day and one of the heaviest walking days. Fushimi Inari before the crowds, Kiyomizu and the slopes by mid-morning, Gion when it turns magical after dark.',
 stats:[['06:10','Leave home'],['1h 25m','Travel time']],
 tips:[{k:'tip',h:'Fushimi at 07:00 is the whole point.',t:'By 09:00 the lower gates are shoulder to shoulder. Walk up to the Yotsutsuji viewpoint, about 35 minutes, and the crowds fall away.'},{k:'wear',h:'Long trousers, light overshirt, rain shell, socks, small towel.',t:'Some temple halls mean removing shoes. Dress respectfully.'},{k:'food',h:'Honke Tankuma Honten does a special kaiseki with advance reservation.',t:'Raju is the simpler lunch: butter chicken, naan, done in 40 minutes.'},{k:'shop',h:'One folding fan or one handcrafted ceramic from the slopes.',t:'Yojiya blotting papers are the classic small gift.'},{k:'gem',h:'Shirakawa canal and Tatsumi bridge after dark.',t:'Willow trees, lanterns, quiet. Two minutes from Hanamikoji.'}],
 stops:[
  {t:'07:00',n:'Fushimi Inari',p:'fushimi',cat:'attraction',key:true,must:true,best:'Before 08:30, before the tour buses',go:{m:'train',t:'45 min',d:"06:10 Hankyu Arashiyama → Katsura → Kyoto-Kawaramachi (17 min), walk 5 min over the bridge to Keihan Gion-Shijo, Keihan local to Fushimi-Inari (8 min), walk 5 min. First Hankyu trains around 05:30"},m:'10,000 vermilion torii up the mountain. Open 24 hours, free.',see:['Senbon Torii double tunnel','Fox statues holding keys and scrolls','Yotsutsuji crossroads viewpoint over Kyoto','The quiet upper loop if legs allow'],eat:['Inari sushi and kitsune udon at the base'],buy:['Mini torii charm','Fox ema plaque'],tip:['Empty-gate photos happen above Yotsutsuji, not at the bottom'],guide:"Turn back at Yotsutsuji unless you love hills. The loop above is another hour and the views do not get better."},
  {t:'09:30',n:'Kiyomizu-dera',p:'kiyomizu',cat:'attraction',key:true,must:true,best:'Morning light on the stage; opens 06:00',go:{m:'train',t:'35 min',d:"Keihan Fushimi-Inari → Kiyomizu-Gojo (8 min), then a 20-minute uphill walk along Gojo-zaka. Taxi from the station is 8 min, about ¥1,200, and saves the climb"},m:'Wooden stage 13 m above the hillside with the city behind it.',see:['The main stage from the Okunoin hall opposite','Otowa waterfall: drink from one stream only','Jishu shrine love stones','Koyasu pagoda across the valley'],guide:"Drink from one of the three Otowa streams only. Drinking from all three is considered greedy and the monks will notice."},
  {t:'11:00',n:'Ninenzaka and Sannenzaka',p:'ninenzaka',cat:'shopping',must:true,go:{m:'walk',t:'5 min',d:"Downhill from the temple gate along Matsubara-dori, left onto Sannenzaka"},m:'The preserved stone slopes down from Kiyomizu. Slow down here.',eat:['Yatsuhashi from Shogoin','Matcha parfait','Tatami-room Starbucks on Ninenzaka','Percent Arabica coffee near Yasaka Pagoda'],buy:['Yojiya blotting paper','Ceramics','Incense','Folding fan'],tip:['Yasaka pagoda lane is the photo, shoot it uphill with the pagoda centred'],guide:"The tatami-room Starbucks on Ninenzaka is real, order and go upstairs. Then % Arabica by the pagoda for the coffee that is actually good."},
  {t:'12:15',n:'Higashiyama walk to Maruyama Park',p:'higashiyama',cat:'nature',go:{m:'walk',t:'15 min',d:"North along Nene-no-michi past Kodai-ji, into Maruyama Park; all downhill and pedestrian"},m:'The lanes between the slopes and Gion, with Chion-in\'s giant gate at the end.',see:['Kodai-ji temple walls and bamboo lane','Chion-in Sanmon gate','Maruyama Park pond'],guide:"Nene-no-michi is the prettiest 400 m in Kyoto and most people skip it because it is not on the way to anything."},
  {t:'12:45',n:'Yasaka Shrine',p:'yasaka',cat:'attraction',go:{m:'walk',t:'3 min',d:"South end of Maruyama Park"},m:'Gateway to Gion. You pass through it again lit up tonight.'},
  {t:'13:00',n:'Lunch: Raju',p:'raju',cat:'food',go:{m:'walk',t:'15 min',d:"West along Shijo, over the Kamo River bridge, north two blocks; flat and busy. Taxi 6 min if tired"},m:'A proper sit-down lunch beats street snacks today.',guide:"Raju's butter chicken is the safer bet if anyone is tired."},
  {t:'14:00',n:'Nishiki Market',p:'nishiki',cat:'food',key:true,must:true,best:'Before 16:00; most stalls shut by 17:00',go:{m:'walk',t:'6 min',d:"Two blocks west of Kawaramachi along Shijo, then north one block"},m:'400 m, around 130 shops. Most stalls shut between 17:00 and 18:00, so mid-afternoon is right.',eat:['Tamagoyaki (rolled omelette) from Miki Keiran','Warabi mochi and dango','Yuba (tofu skin) snacks','Matcha soft-serve','Pickle samples (tsukemono)'],buy:['Aritsugu kitchen knives, engraved while you wait','Yatsuhashi','Loose-leaf Uji tea'],tip:['No eating while walking, each stall has a spot to stand'],guide:"Straight to Miki Keiran for the tamagoyaki, then black sesame soft-serve. Aritsugu will engrave your name in kanji on a knife while you wait."},
  {t:'15:30',n:'Pontocho and the Kamo riverbank',p:'pontocho',cat:'nature',go:{m:'walk',t:'8 min',d:"East back along Shijo; Pontocho is the narrow lane one block before the river"},m:'Sit on the river steps for an hour. This is the rest before the evening.',see:['Pontocho alley in daylight','Couples spaced evenly along the Kamo bank, a Kyoto ritual','Sanjo bridge'],guide:"Buy a coffee and sit on the bank at Sanjo with your feet over the edge. Everyone in Kyoto does this and nobody tells tourists."},
  {t:'17:00',n:'Gion at dusk',p:'gion',cat:'attraction',key:true,must:true,best:'17:15 to 18:15, sunset 17:15, maiko hour',go:{m:'walk',t:'10 min',d:"Over Shijo bridge, Hanamikoji is the first big street south after the Minamiza theatre"},m:'Hanamikoji between 17:15 and 18:15 is when geiko and maiko head to appointments, and the lanterns come on as the light goes.',see:['Hanamikoji wooden teahouses','Kenninji temple gate at the end of the street','Yasaka Shrine lanterns lit, back at the top of Shijo'],eat:['Gion Tsujiri matcha parfait'],tip:['Never photograph in the private side alleys, signs say so and fines apply'],guide:"Stand near the Ichiriki teahouse corner at 17:30. Never step into the private alleys with the no-photo signs, the fine is ¥10,000."},
  {t:'18:30',n:'Shirakawa lanes',p:'shirakawa',cat:'nature',best:'After dark, lanterns on',go:{m:'walk',t:'6 min',d:"North across Shijo, two blocks to the canal. Home afterwards: walk to Kawaramachi 8 min, Hankyu 17 min"},m:'Hidden gem. Canal, willows, lanterns, no crowds.',see:['Tatsumi bridge','Tatsumi Daimyojin shrine'],guide:"Tatsumi bridge at 20:00 is the quietest, prettiest ten minutes in Kyoto. Bring nothing but a phone."}],
 ess:{wear:['Long trousers','Light overshirt','Rain shell','Socks','Small towel'],eat:['Inari sushi','Yatsuhashi','Matcha parfait','Raju lunch'],buy:['Folding fan','Ceramic','Yojiya papers','Fox charm']}},

{id:'oct12',n:6,d:'Monday, 12 October',short:'Mon 12 Oct',title:'Ine & Amanohashidate',hero:['funaya','amano','ineboat'],mode:'driving',wx:{t:23,c:'Windy',i:'🌬️',ll:[35.67,135.29]},
 desc:'Adventure day by rental car. Amanohashidate first (about two hours north), then the funaya boat houses of Ine, the hilltop viewpoint and a bay boat. Back before dark.',
 stats:[['08:00','Pick up car'],['5h','Driving']],
 tips:[{k:'tip',h:'Photograph every bumper, wheel, mirror, door, windscreen and the fuel gauge before driving.',t:'Confirm insurance, ETC card, fuel type and tolls. The driver\'s IDP must be the 1949 Geneva Convention format.'},{k:'food',h:'Bring snacks from the Ministop; dinner is at Kyoto Station on the way home.',t:'This coast is seafood and sake. Eat only where ingredients are clear.'},{k:'gem',h:'Look through your legs at Amanohashidate.',t:'Matanozoki: from the viewpoint, bend and look upside down and the sandbar becomes a bridge to heaven. Everyone does it.'},{k:'wear',h:'Trousers, tee, light jacket, waterproof outer layer.',t:'Coastal weather is windier and wetter than Kyoto.'},{k:'tip',h:'Parking is the whole logistics puzzle today.',t:'Amanohashidate: Chion-ji lots. Ine: Shichimensan lot by the sea-taxi pier, or the free roadside station on the hill. Never drive into the funaya lane.'}],
 stops:[
  {t:'07:15',n:'JR Saga-Arashiyama → Kyoto Station',p:'sagaarashiyama',cat:'transport',go:{m:'train',t:'16 min',d:"Sagano line, every 10 to 15 min. Car rental offices are on the Hachijo (south) side of Kyoto Station"},m:'Water, snacks, charger, driving documents, sunglasses, rain shell.'},
  {t:'08:00',n:'Rental car pickup, Kyoto Station Hachijo side',p:'kyotost',cat:'transport',key:true,go:{m:'walk',t:'8 min',d:"Toyota Rent a Car, Nippon, Times and Orix all sit within a few minutes of the Hachijo exit. Book a compact with English navigation and an ETC card"},m:'Driver needs passport, home licence and a 1949-format International Driving Permit. Photograph every panel and the fuel gauge. Japan drives on the left; speed limit 100 on the expressway, 40 to 50 in town.',tip:['Set the navigation by phone number or map code: Amanohashidate Chion-ji 0772-22-2553'],guide:"Ask for the compact class with a full tank agreement. Return it full; the station on Hachijo-dori is two blocks from the office."},
  {t:'10:15',n:'Amanohashidate',best:'Morning light; afternoons haze',p:'amano',cat:'nature',key:true,must:true,go:{m:'car',t:'2h 10m',d:"Kyoto-Jukan Expressway north to Miyazu-Yosano Amanohashidate IC, then Route 178, tolls about ¥3,000 one way. Little traffic on a weekday morning. Park at the Chion-ji / Monju lots by the sandbar, about ¥700 a day, or the Kasamatsu cable-car base lot on the far side, ¥500"},m:'A 3.6 km pine-covered sandbar across Miyazu Bay, one of Japan\'s three scenic views.',see:['Kasamatsu Park viewpoint by cable car or chairlift (¥800 return)','Chion-ji temple by the car park with its fan-shaped fortunes','Rent a bike and ride the sandbar, 20 minutes each way'],eat:['Chie-no-mochi rice cakes at the temple gate shops (rice, sugar, beans)'],tip:['Pick one viewpoint. Kasamatsu is the classic one'],guide:"Do the matanozoki: bend over and look at the sandbar upside down through your legs. Yes, everyone does it."},
  {t:'12:30',n:'Drive to Ine',cat:'transport',go:{m:'car',t:'40 min',d:"Route 178 along the coast, narrow in places, no tolls. Lanes in Ine village itself are single-track: do not drive into the funaya street"},m:'Coastal road the whole way.'},
  {t:'13:15',n:'Park at Shichimensan lot, Ine',p:'ineura',cat:'transport',go:{m:'car',t:'',d:"Town lots: Shichimensan (57 spaces, sea-taxi pier beside it), Ineura Park (22) and Onishi (37). First 30 minutes free, then ¥100 per 30 minutes. Funaya no Sato roadside station above the village is free with 138 spaces if these are full"},m:'Shichimensan is the one to aim for: the sea taxis leave from the pier next to it.'},
  {t:'13:30',n:'Ine Bay waterfront and Ineura Park',best:'Early afternoon, boats out on the water',p:'ineura',cat:'attraction',key:true,must:true,go:{m:'walk',t:'8 min',d:"Along the single harbour road; the funaya are on your right the whole way"},m:'Around 230 funaya boat houses ring the bay, boats parked underneath, families living above. Most are private homes.',see:['Walk the single lane behind the houses','Ineura Park by the water','Boat garages open to the sea'],eat:['Cafes along the lane, check ingredients'],tip:['Do not enter any funaya without permission, the town asks explicitly'],guide:"Have a coffee in a funaya cafe on the lane. Sit at the back and you are sitting above the boats."},
  {t:'14:30',n:'Sea taxi around the bay',p:'ineboat',cat:'booked',key:true,must:true,go:{m:'boat',t:'25 to 30 min',d:"Small fishermen's boats from the pier by Shichimensan parking, ¥1,000 per person, up to five people, walk-up, no booking. The big cruise boat from Hide terminal is ¥1,200 and runs on a timetable; the taxi gets closer to the houses"},m:'A private boat for the three of you, skippered by a local fisherman who points out which house is which.',see:['Funaya facades from the sea','Kites and gulls that follow the boat'],tip:['Buy the ¥100 snack bag on the boat; the kites swoop and take it from your fingers'],guide:"Take the sea taxi over the cruise. It is your own boat, and the boatman will tell you which funaya was in which film."},
  {t:'15:15',n:'Funaya no Sato Ine viewpoint',p:'funaya',cat:'nature',must:true,go:{m:'car',t:'4 min',d:"Up the hill behind the village, free parking at the roadside station"},m:'The roadside station on the hill with the full sweep of the bay below. Shop and restaurants here close at 17:00 (closed Tuesdays; you are here on a Monday).',see:['Whole-bay panorama','Local produce shop'],buy:['Regional snacks','Maritime gifts']},
  {t:'16:15',n:'Drive back to Kyoto',cat:'transport',go:{m:'car',t:'2h 20m',d:"Same road back: Route 178, Route 176, Kyoto-Jukan Expressway. Evening traffic builds on the city end after 18:00. Fuel up on Hachijo-dori before returning"},m:'Do not push it after dark if the driver is tired; the coast road has no lighting.'},
  {t:'18:45',n:'Return the car, Kyoto Station',p:'kyotost',cat:'transport',go:{m:'car',t:'',d:"Most offices close at 20:00; confirm the return time on the contract"},m:'Full tank, receipt in hand, photos of the car again.'},
  {t:'19:15',n:'Dinner at Kyoto Station, then JR home',p:'kyotost',cat:'food',go:{m:'train',t:'16 min',d:"Sagano line to Saga-Arashiyama, then walk or taxi"},m:'Kyoto Station has a full floor of restaurants on the 10th and 11th floors (The Cube, Ramen Street). Eat here rather than hunting in Arashiyama at night.',eat:['Ramen Street on the 10th floor','Curry at the station']}],
 ess:{wear:['Trousers','Light jacket','Waterproof layer','Walking shoes'],eat:['Snacks from Kyoto','Chie-no-mochi'],buy:['Regional snacks','Maritime gifts','Small crafts']}},

{id:'oct13',n:7,d:'Tuesday, 13 October',short:'Tue 13 Oct',title:'Rabbit Island',hero:['okuno','tadanoumi','okunomuseum','okunobattery'],mode:'transit',wx:{t:23,c:'Breezy',i:'🌤️',ll:[34.31,132.99]},
 desc:'Your longest travel day: Shinkansen to Fukuyama, a Kodama hop to Mihara, the hourly Kure line to Tadanoumi, then a 15-minute ferry. About 3h 30m each way. The island is 4 km around, full of rabbits and a much darker history.',
 stats:[['05:45','Leave home'],['3h 30m','Each way']],
 tips:[{k:'tip',h:'The hourly Kure line is the weak link, not the ferry.',t:'Miss the train at Mihara and you lose an hour each way. Lock the exact Kodama and Kure line departures a week before and screenshot them.'},{k:'gem',h:'Rabbit Line fast boat from Mihara port.',t:'On some days a direct 40-minute boat runs from Mihara Port (10 min walk from the Shinkansen) to the island, ¥1,600. It skips the Kure line entirely. Check whether it runs on a Tuesday in October; if yes, take it.'},{k:'food',h:'Do not depend on the island for lunch.',t:'Pack sandwiches, rice, protein bars, fruit, water. Nothing is sold on the island except at the hotel.'},{k:'gem',h:'The rabbit food is not sold on the island.',t:'Buy pellets or a bag of cabbage at the Tadanoumi ferry terminal shop before boarding.'},{k:'wear',h:'Walking shoes, light trousers, light jacket, rain shell, hat.',t:'Wind makes it feel cooler.'},{k:'shop',h:'Tadanoumi terminal: rabbit plush, stationery, mugs, original goods.',t:'Plus the rabbit soft-serve.'}],
 stops:[
  {t:'05:45',n:'JR Saga-Arashiyama → Kyoto Station',p:'sagaarashiyama',cat:'transport',go:{m:'train',t:'16 min',d:"First Sagano line trains run from about 05:30; confirm the exact one a week before. Taxi to the station is 8 min if you would rather not walk in the dark"},m:'Breakfast from the Ministop the night before.'},
  {t:'06:20',n:'Shinkansen Kyoto → Fukuyama',p:'kyotost',cat:'booked',key:true,go:{m:'train',t:'1h 35m',d:"Nozomi or Hikari direct to Fukuyama. Mihara is a Kodama-only stop, so the fastest pattern is a fast train to Fukuyama and one Kodama hop"},m:'Reserve seats. Around ¥10,000 each one way; the return is the same.'},
  {t:'08:05',n:'Kodama Fukuyama → Mihara',p:'mihara',cat:'transport',go:{m:'train',t:'15 min',d:"One stop on the Kodama, cross-platform change at Fukuyama"},m:'Small station, quick change.'},
  {t:'08:30',n:'JR Kure line to Tadanoumi',p:'tadanoumi',cat:'transport',go:{m:'train',t:'25 min',d:"This is the leg that decides the day: the Kure line runs roughly once an hour. Look up the departure that follows your Kodama and hold to it; if you miss it you wait an hour. About ¥330"},m:'Local one- or two-car train. Tadanoumi is a request-stop-style rural station; the port is 3 minutes east on foot.'},
  {t:'09:00',n:'Tadanoumi Port',p:'tadanoumi',cat:'shopping',key:true,go:{m:'walk',t:'3 min',d:"Out of the station, follow the rabbit signs east to the terminal shop"},m:'Buy return ferry tickets (¥720) and the rabbit pellets (¥300 a bag). Luggage storage ¥500 if needed.',buy:['Rabbit pellets, two bags','Rabbit plush and stationery','Ferry tickets'],eat:['Rabbit soft-serve'],guide:"Buy the rabbit pellets at the terminal shop before you board. Nothing is sold on the island. Return the empty bag later for a free postcard."},
  {t:'09:30',n:'Ferry to Okunoshima',p:'okunoferry',cat:'transport',key:true,go:{m:'boat',t:'15 min',d:"Every 30 to 45 minutes from about 07:30. Both the large ferry and the small passenger boat take the same ticket"},m:'Screenshot the timetable at the terminal for the return.'},
  {t:'09:45',n:'Okunoshima rabbits',p:'okuno',cat:'nature',key:true,must:true,go:{m:'walk',t:'',d:"A free shuttle bus meets each ferry and runs to the Kyukamura hotel, 5 min; or walk the shore path, 15 min. Bikes for hire at the hotel, about ¥600 for two hours"},m:'Hundreds of feral rabbits. They gather near the pier, the hotel lawn and the campsite.',see:['Rabbits at the pier on arrival','Hotel Kyukamura lawn','Coastal loop path, about 4 km'],tip:['Crouch and hold food low, they climb into laps','Do not feed by the road, and never pick them up'],guide:"Walk clockwise from the pier. The rabbits by the hotel lawn are the boldest and will climb into your lap."},
  {t:'11:30',n:'Poison gas museum and ruins',p:'okunomuseum',cat:'attraction',must:true,go:{m:'walk',t:'10 min',d:"Back toward the pier; the museum is beside the visitor centre, the power-plant ruins a further 10 minutes along the coast"},m:'Japan secretly made chemical weapons here from 1929 to 1945. The island was wiped off maps.',see:['Small museum near the pier, ¥190','Power plant ruins, the most photographed building','Battery ruins on the hill'],guide:"The museum costs ¥190 and takes twenty minutes. Do not skip it, then walk to the power-plant ruins for the photo."},
  {t:'12:30',n:'Packed lunch, or the hotel cafe',cat:'food',go:{m:'walk',t:'',d:"Kyukamura hotel has the only cafe and restaurant on the island"},m:'From the Ministop, or a light meal at the hotel cafe, ¥900 to ¥1,500.'},
  {t:'14:15',n:'Ferry back to Tadanoumi',cat:'transport',go:{m:'boat',t:'15 min',d:"Take the ferry that lands you 15 minutes before the hourly Kure line train; timings at the terminal"},m:'Leave with margin. The last ferries run past 19:00 but the train connections thin out.'},
  {t:'15:00',n:'Kure line → Mihara → Kodama → Fukuyama → Shinkansen',p:'mihara',cat:'transport',go:{m:'train',t:'2h 40m',d:"Reverse of the morning. Kodama Mihara → Fukuyama 15 min, then Nozomi/Hikari Fukuyama → Kyoto about 1h 35m"},m:'Home in Arashiyama around 18:30 to 19:00.'},
