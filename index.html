   {t:'09:10',n:'Shinkansen Kyoto → Odawara',p:'odawara',cat:'booked',key:true,go:{m:'train',t:'2h 05m',d:"Hikari only: Nozomi does not stop at Odawara. Reserved seats"},m:'Hikari services stop at Odawara, about 2h 05m. Nozomi does not stop, so book the right train. Fuji on the left, seats A, about 30 minutes before Odawara.',guide:"Sit on the left, seats A. Fuji appears around Shin-Fuji and stays with you for ten minutes if the sky is clear."},
   {t:'11:20',n:'Odawara: Hakone Freepass',p:'odawara',cat:'transport',go:{m:'walk',t:'5 min',d:"Odakyu ticket counter on the east side of Odawara station"},m:'Odakyu counter at the station. Then the Hakone Tozan line to Hakone-Yumoto, 15 minutes.',buy:['Hakone Freepass, 2-day, from Odawara']},

 desc:'The smartest shopping day, because 17 and 18 October are still in hand for pickups and sold-out second chances. Ueno and Ameyoko in the morning, Yanaka at lunch, then UNIQLO and Onitsuka Tiger in Ginza, and BEAMS JAPAN in Shinjuku for souvenirs before dinner.',
 stats:[['09:15','Ueno'],['1h 05m','Travel time']],

  document.getElementById('gprev').onclick=()=>goTo(gcur-1);document.getElementById('gnext').onclick=()=>goTo(gcur+1);
  [...gd.children].forEach((d,i)=>{d.onclick=()=>goTo(i);});
  let sx=0,sy=0,dx=0,drag=false,axis=null;const w=()=>gal.clientWidth||1;
  gal.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=true;axis=null;gal.setPointerCapture&&gal.setPointerCapture(e.pointerId);gal.style.transition='none';};
  gal.onpointermove=e=>{if(!drag)return;const mx=e.clientX-sx,my=e.clientY-sy;if(!axis){if(Math.abs(mx)>6||Math.abs(my)>6)axis=Math.abs(mx)>Math.abs(my)?'x':'y';else return;}if(axis!=='x')return;dx=mx;const edge=(gcur===0&&dx>0)||(gcur===gn-1&&dx<0);gal.style.transform=`translateX(calc(${-gcur*100}% + ${edge?dx*0.35:dx}px))`;};
  const end=()=>{if(!drag)return;drag=false;if(axis==='x'&&Math.abs(dx)>w()*0.18)goTo(gcur+(dx<0?1:-1));else goTo(gcur);};
  gal.onpointerup=end;gal.onpointercancel=end;gal.onpointerleave=end;
  document.onkeydown=e=>{if(!document.getElementById('day').classList.contains('active'))return;if(e.key==='ArrowRight')goTo(gcur+1);if(e.key==='ArrowLeft')goTo(gcur-1);};
  const sw=document.getElementById('dsw');
  if(!sw.dataset.built){sw.innerHTML=DAYS.map(d=>`<button data-id="${d.id}" onclick="openDay('${d.id}')" aria-label="${d.d}"><small>${d.short.split(' ')[0]}</small><b>${d.short.split(' ')[1]}</b>${d.variants?'<span class="v" title="Two options"></span>':''}</button>`).join('');sw.dataset.built='1';}
  sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===day.id));
  const onb=sw.querySelector('.on');if(onb){const left=onb.offsetLeft-sw.clientWidth/2+onb.offsetWidth/2;sw.scrollTo({left:Math.max(0,left),behavior:switching?'smooth':'auto'});}
  // directional slide of the sheet content when moving between days
  const body=document.getElementById('sheetBody');const prevIdx=DAYS.findIndex(d=>d.id===(window.__lastDay||day.id));const dir=DAYS.findIndex(d=>d.id===day.id)-prevIdx;window.__lastDay=day.id;
  if(switching&&!sameDay){body.classList.remove('sl','sr');void body.offsetWidth;body.classList.add(dir>0?'sl':'sr');body.dataset.nostagger='1';}else{body.classList.remove('sl','sr');delete body.dataset.nostagger;}
  document.getElementById('dayPill').textContent=`Day ${String(day.n).padStart(2,'0')} of ${DAYS.length}`;
  document.getElementById('dDate').textContent=day.d;
  document.getElementById('dTitle').textContent=day.title;
  document.getElementById('dDesc').textContent=day.desc;
  document.getElementById('dStats').innerHTML=[...day.stats,[String(day.stops.length),'Planned stops']].map(s=>`<div class="stat"><div class="v">${s[0]}</div><div class="l">${s[1]}</div></div>`).join('');
  const tips=document.getElementById('dTips');tips.innerHTML=day.tips.map(t=>`<div class="slide"><div class="tip" role="button" tabindex="0"><span class="orb k-${t.k}"></span><p><b>${t.h}</b>${t.t?' '+t.t:''}</p></div></div>`).join('');tips.querySelectorAll('.tip').forEach(el=>el.onclick=()=>el.classList.toggle('x'));
  const dots=document.getElementById('dDots');dots.innerHTML=day.tips.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');tips.scrollLeft=0;
  tips.onscroll=()=>{const i=Math.round(tips.scrollLeft/tips.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));};
  // good to know (Klook-style info chips), derived from the day's data
  const modes={};day.stops.forEach(x=>{if(x.go&&x.go.m)modes[x.go.m]=(modes[x.go.m]||0)+1;});
  const walkMin=day.stops.reduce((a,x)=>{if(x.go&&x.go.m==='walk'&&x.go.t){const m=parseInt(x.go.t);if(!isNaN(m))return a+m;}return a;},0);
  const booked=day.stops.filter(x=>x.cat==='booked').length;const first=day.stops[0]?day.stops[0].t:'';const last=day.stops[day.stops.length-1]?day.stops[day.stops.length-1].t:'';
  const gtk=[[I.clock,`${first} to ${last}`,'Day span'],[I.train,Object.entries(modes).filter(([m])=>m!=='walk').map(([m,n])=>`${n} ${m}`).join(' · ')||'On foot','Transfers'],[GI.walk,walkMin?`~${walkMin} min`:'Light','Walking between stops'],[I.ticket,booked?`${booked} booked`:'None','Reservations'],[I.sun,`${day.wx.t}° ${day.wx.c}`,'Forecast estimate']];
  document.getElementById('dGtk').innerHTML=gtk.map(g=>`<div class="g">${g[0]}<div><b>${g[1]}</b><small>${g[2]}</small></div></div>`).join('');
  const musts=day.stops.map((x,i)=>[x,i]).filter(([x])=>x.must);
  document.getElementById('dHl').innerHTML=musts.length?`<div class="h">Highlights</div>`+musts.map(([x,i])=>`<button onclick="(function(){const el=document.querySelectorAll('#dStops .stop')[${i}];if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});}})()"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span>${x.n}</span><small>${x.t}</small></button>`).join(''):'';
  const nowIdx=nowStopIndex(day);
  document.getElementById('dCnt').innerHTML=I.star+day.stops.filter(s=>s.must).length+' must-see';
  const tl=document.getElementById('dStops');tl.innerHTML='';
  day.stops.forEach((s,i)=>{
    const place=s.p&&P[s.p]?P[s.p][0]:'';
    if(s.go&&(s.go.t||s.go.d)){const gdiv=document.createElement('button');gdiv.className='go';gdiv.style.setProperty('--i',i);gdiv.innerHTML=`<span class="gi">${GI[s.go.m]||I.train}</span><span class="gt"><b>${GL[s.go.m]||''}${s.go.t?' · '+s.go.t:''}</b>${s.go.d?`<span class="gd">${s.go.d}</span>`:''}</span>${s.go.d?`<span class="gc">${I.chev}</span>`:''}`;if(s.go.d)gdiv.onclick=()=>gdiv.classList.toggle('open');tl.appendChild(gdiv);}
    const st=document.createElement('div');st.className='stop open'+(i<nowIdx?' done':'');
    const tags=[i===nowIdx?'<span class="tag now">Now</span>':'',s.must?'<span class="tag must">Must see</span>':'',s.cat==='booked'?'<span class="tag booked">Booked</span>':'',s.halal?'<span class="tag halal">Halal</span>':'',s.opt?'<span class="tag opt">Optional</span>':''].filter(Boolean).join('');
    const maps=place?`<a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Open in Maps ${I.ext}</a>`:'';
    const more=`${s.m?`<p class="why">${s.m}</p>`:''}${s.guide?`<div class="guide"><span class="orb"></span><p><b>Local pick.</b> ${s.guide}</p></div>`:''}${sec('See',I.eye,s.see)}${sec('Eat',I.food,s.eat)}${sec('Buy',I.bag,s.buy)}${sec('Insider tip',I.bulb,s.tip,'tipbox')}${maps}`;
    st.innerHTML=`<div class="ic" style="background:${CATC[s.cat]};--ring:color-mix(in srgb,${CATC[s.cat]} 22%,var(--bg))">${I[CATI[s.cat]]}</div><button class="card" aria-expanded="true"><div class="bd"><span class="chev">${I.chev}</span><div class="nm">${s.n}</div>${tags?`<div class="tags">${tags}</div>`:''}<div class="meta"><span>${I.clock}${s.t}</span>${s.best?`<span class="best">${I.sun}<em>${s.best}</em></span>`:''}${place?`<span class="pl">${I.pin}<em>${place}</em></span>`:''}</div><div class="more"><div class="inner">${more}</div></div></div></button>`;
    const inner=st.querySelector('.more .inner');if(s.p==='hotel')inner.prepend(mkImg('tokyohotel'));else if(s.p==='airbnb')inner.prepend(mkImg('kyotoapt'));else if(s.key&&s.p&&P[s.p][0]!=='')inner.prepend(mkImg(s.p));
    st.style.setProperty('--i',i);
    st.querySelector('.card').onclick=e=>{if(e.target.closest('a'))return;st.classList.toggle('open');st.querySelector('.card').setAttribute('aria-expanded',st.classList.contains('open'));};
    tl.appendChild(st);
  });
  const chip=document.getElementById('nextchip');chip.classList.add('hidden');
  if(day.id===todayId()){const n=jstNow();const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    const line=document.createElement('div');line.className='nowline';line.innerHTML=`<span>NOW ${hm}</span>`;
    const stops=tl.querySelectorAll('.stop');if(nowIdx>=0&&stops[nowIdx])stops[nowIdx].after(line);else tl.prepend(line);
    const next=day.stops[nowIdx+1];chip.classList.remove('hidden');chip.innerHTML=`<span class="dot"></span>${next?`Next <b>${next.t} · ${next.n}</b>`:'<b>Last stop of the day</b>'}`;}
  const e=day.ess;
  document.getElementById('dEss').innerHTML=`<h3>Wear today</h3><div class="chips">${e.wear.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Eat</h3><div class="chips">${e.eat.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Buy here</h3><div class="chips">${e.buy.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
  const pts=[];const seen=new Set();day.stops.forEach(s=>{if(s.p&&P[s.p]&&P[s.p][0]!==''&&!seen.has(s.p)){seen.add(s.p);pts.push(P[s.p][0]);}});
  const cta=document.getElementById('cta');
  if(pts.length>=2){const w=pts.slice(1,-1).slice(0,9);cta.href=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pts[0])}&destination=${encodeURIComponent(pts[pts.length-1])}${w.length?'&waypoints='+encodeURIComponent(w.join('|')):''}&travelmode=${day.mode}`;cta.style.display='flex';document.getElementById('ctaTxt').textContent=day.id===todayId()?"Start today's route":'Open route in Maps';}else cta.style.display='none';
  weather(day);location.hash=day.id;
}
document.getElementById('backBtn').onclick=()=>{document.getElementById('day').classList.remove('active');document.getElementById('overview').classList.add('active');window.scrollTo(0,0);history.replaceState(null,'',' ');};
/* ---------- motion helpers ---------- */
(function(){
  const dsw=document.getElementById('dsw');const sent=document.createElement('div');sent.style.cssText='height:1px;margin-top:-1px';dsw.parentNode.insertBefore(sent,dsw);
  if('IntersectionObserver' in window)new IntersectionObserver(([e])=>dsw.classList.toggle('stuck',!e.isIntersecting&&e.boundingClientRect.top<0)).observe(sent);
  const gal=document.getElementById('gal');const hero=document.querySelector('.hero');const cta=document.getElementById('cta');
  let lastY=0,ticking=false;const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=window.scrollY;
    if(!rm&&window.innerWidth<900&&document.getElementById('day').classList.contains('active')){const hh=hero.offsetHeight;if(y<hh)hero.style.setProperty('--py',`${y*0.28}px`);}
    if(window.innerWidth<900){if(y>240&&y>lastY+6)cta.classList.add('hide');else if(y<lastY-6||y<240)cta.classList.remove('hide');}
    lastY=y;ticking=false;});},{passive:true});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
setInterval(()=>{if(curDay&&curDay.id===todayId()&&document.getElementById('day').classList.contains('active')){const y=window.scrollY;openDay(curDay.id);window.scrollTo(0,y);}},60000);
renderOverview();renderPlaces();
const h0=location.hash.replace('#','');if(h0&&DAYS.find(d=>d.id===h0))openDay(h0);
</script>
