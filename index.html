 {k:'x-kakigori',n:'Kakigori (shaved ice)',city:'Everywhere',cat:'food',sum:'Shaved ice with syrup, often with condensed milk or matcha and red bean. Mostly a summer thing, so in mid-October the specialist shops are seasonal or shut; year-round bets are department-store cafes, Nishiki Market stalls and the matcha cafes in Kyoto (Gion Tsujiri and Nakamura Tokichi in Uji serve it all year).',eat:['Uji matcha kakigori with shiratama at Gion Tsujiri','Strawberry milk kakigori at a depachika cafe'],tip:['Ask before queueing in October; many kakigori-only shops close for the season']},

 {k:'x-shibuyasky',n:'Shibuya Sky: how to get the sunset slot',city:'Tokyo',cat:'attraction',sum:'The rooftop at Shibuya Scramble Square, 230 m up and open to the sky. Sunset slots are the hardest ticket in Tokyo and sell out the moment they release. Tickets go on sale 4 weeks ahead at 12:00 Japan time on the official site, by 30-minute entry slot; the slot is your entry time, and once you are up there you can stay until closing (last entry 21:20, closes 22:00).',see:['Sky Edge, the open corner with no glass, the queue everyone lines up for','The Sky Gate escalator entry','Rooftop lawn loungers on the far side, usually empty'],tip:['Sunset in Tokyo on 18 October is about 17:05, so the slot to buy is 16:20 or 16:40: up in daylight, sunset from the roof, then the city lighting up, all on one ticket','Sale opens 20 September at 12:00 JST for 18 October (4 weeks ahead). That is 07:00 in Dubai and 13:00 in Sydney','Create the account and save the card before the sale; slots go in under a minute','Weekday and Sunday evenings release the same way; a Sunday is slightly easier than a Saturday','If sunset sells out, buy any earlier slot the same day and simply stay up there until dark','Tripods and selfie sticks are banned; phones must go in the supplied pouch at Sky Edge','Rain or strong wind closes the rooftop and they refund; the indoor floor stays open','Cheaper fallbacks with the same view direction: Mag\'s Park on Shibuya 109 (¥600, walk-in) and the Tokyo Metropolitan Government Building (free, open late)'],buy:['Tickets only from the official site or the Shibuya Sky app; resale sites are not honoured'],guide:"Buy 16:20 or 16:40, not the sunset-labelled slot. You get in while it is bright, watch the sun go down, and stay for the lights, which is three photo sets on one ticket.",q:'Shibuya Sky'},
 {k:'x-pokemon',n:'Pokémon Cafe and Pokémon Center',city:'Tokyo',cat:'shopping',sum:'The Cafe in Nihonbashi is reservation-only: bookings open exactly 31 days ahead at 18:00 Japan time and go in minutes. For 16 October that is 15 September at 18:00 JST. No walk-ins. The Pokémon Center DX is in the same building, and Shibuya Parco 6F has another with Nintendo Tokyo next door, both walk-in.',buy:['Cafe-exclusive plush and mugs (only sold to diners)','Parco-exclusive goods at Shibuya'],tip:['Set an alarm for 15 Sep 18:00 JST, which is 14:00 in Dubai and 19:00 in Sydney','If the booking fails, Shibuya Parco 6F needs no reservation']},
 {k:'x-kitkat',n:'KitKat flavours',city:'Everywhere',cat:'shopping',sum:'Japan has dozens: matcha, hojicha, strawberry, sake, wasabi, sweet potato in autumn. Regional boxes are sold at station shops and Donki; the big assorted boxes at Narita and Haneda are the easy gift.',buy:['Uji matcha box (Kyoto)','Setouchi lemon (Hiroshima area, 13 Oct)','Tokyo Banana KitKat (Tokyo Station)']},
 {k:'x-tokyobanana',n:'Tokyo Banana',city:'Tokyo',cat:'shopping',sum:'The Tokyo souvenir: banana-cream sponge cakes in printed boxes. Tokyo Station, Haneda and Narita all stock it; the seasonal prints sell out first.',buy:['Standard box of 8','Seasonal pattern box']},

 {k:'x-ujimatcha',n:'Uji matcha',city:'Kyoto',cat:'shopping',sum:'The tea town south of Kyoto. Ippodo and Marukyu Koyamaen tins are the serious gift; Nishiki stalls sell matcha everything. Ceremonial grade is for whisking, culinary grade for lattes and baking.',buy:['Ippodo tin from Teramachi','Matcha KitKats and chocolates']},
 {k:'x-furoshiki',n:'Furoshiki and tenugui',city:'Kyoto',cat:'shopping',sum:'Wrapping cloths and hand towels, printed, light, flat in a suitcase. Musubi (furoshiki) shops in Kyoto and the tenugui stalls on Nakamise are the good sources.',buy:['A large furoshiki as a scarf or wrap','Three tenugui for gifts']},
 {k:'x-knives',n:'Japanese kitchen knives',city:'Kyoto',cat:'shopping',sum:'Aritsugu at Nishiki (engraved on the spot, ¥15,000 up), Kama-Asa on Kappabashi in Tokyo. A santoku or gyuto is the versatile first knife. Checked luggage only; ask for the blade wrapped.',buy:['Santoku 165 mm','Petty knife 120 mm']},

 {k:'x-loft',n:'Loft, Hands, Muji, Itoya',city:'Tokyo',cat:'shopping',sum:'The lifestyle four. Loft for gifts and stationery, Hands for tools and oddities, Muji Ginza for everything plain, Itoya for twelve floors of paper. All within Ginza and Shibuya.',buy:['Frixion pens by the box','Muji travel bottles','Itoya notebooks']},

 {k:'x-toilets',n:'Toilets',city:'Everywhere',cat:'flex',sum:'Free, clean, everywhere: konbini, stations, department stores. The panel: 小 is small flush, 大 big flush, おしり is the bidet, 止 stops it. Carry a small towel; hand dryers are rare.'},
 {k:'x-umbrella',n:'Umbrellas and rain',city:'Everywhere',cat:'flex',sum:'A ¥500 clear umbrella from any konbini is the local standard. Shops have umbrella bags or stands at the door; leaving it there is normal, taking someone else\'s is not.'},
 {k:'x-shinkansen',n:'Shinkansen know-how',city:'Stations',cat:'transport',sum:'Cars 1 to 3 are non-reserved on most trains; reserved is worth it for three people together. Oversized luggage (over 160 cm total) needs the rear-row seats booked. Doors open for about a minute at stops, be ready.',tip:['Fuji is on the right Tokyo → Kyoto, left the other way','Ekiben on the platform, not in the train']},
 {k:'x-kyotobrown',n:'Why Kyoto\'s konbini signs are brown',city:'Kyoto',cat:'flex',sum:'A city rule limits bright signage in historic districts, so 7-Eleven, Lawson and McDonald\'s all go muted brown near Gion and Arashiyama. A small photo in itself.'},
 {k:'x-deer',n:'Nara deer, the rules',city:'Nara',cat:'flex',sum:'They bow because people taught them to. Crackers ¥200; hold them up and they bow, give it, step back. Paper, maps and hems are fair game to them. Do not feed anything else.'},
 {k:'x-ryokan',n:'Onsen manju and station sweets',city:'Hakone',cat:'shopping',sum:'Hakone-Yumoto\'s street sells onsen manju (steamed buns) still warm, and yosegi marquetry puzzle boxes, the local craft. Good five-minute stop before the Romancecar.'},
 {k:'x-shrinevstemple',n:'Shrine or temple?',city:'Everywhere',cat:'flex',sum:'Torii gate, Shinto shrine: bow, rinse hands, coin, two bows, two claps, one bow. Big gate with statues, Buddhist temple: coin, bow, palms together, no clapping. Both are fine to visit without ceremony.'},
 {k:'x-photos',n:'Photo manners',city:'Everywhere',cat:'flex',sum:'No photos inside temple halls unless a sign says yes. Never photograph geiko or maiko up close in Gion; the private lanes are fined. Ask before photographing food-stall staff; most say yes.'},
 {k:'x-emergency',n:'Emergency numbers',city:'Everywhere',cat:'flex',sum:'110 police, 119 ambulance and fire (English available), #7119 medical advice in Tokyo, JNTO 24-hour visitor hotline 050-3816-2787. Koban police boxes on most corners help with directions and lost items.'},
 {k:'x-etiquette',n:'Small etiquette that matters',city:'Everywhere',cat:'flex',sum:'No tipping. Money on the tray. No eating while walking. Quiet on trains, no calls. Stand left on escalators in Tokyo, right in Osaka. Shoes off where there is a step up. Carry your rubbish.'}
];

 {t:'Show the driver (addresses in Japanese)',html:'<div id="driverList"></div><p style="font-size:12px;color:var(--ink-3);margin:8px 0 0">Tap a card to open it full screen for the taxi driver.</p>'},

 {t:'Emergency and help',html:'<ul><li><b>110</b> police · <b>119</b> ambulance and fire (English operators available)</li><li><b>#7119</b> non-emergency medical advice line (Tokyo)</li><li>Japan Visitor Hotline, JNTO, 24 h English: <b>050-3816-2787</b></li><li>Lost Suica or card: tell the station office; lost items in taxis go to the taxi company on the receipt, always take the receipt</li><li>Koban (police boxes) are on most main corners and will help with directions and lost items</li><li>Pharmacies: Matsumoto Kiyoshi or Sundrug, look for the green cross; paracetamol is Tylenol or Bufferin</li></ul>'},
 {t:'Community wisdom (r/JapanTravel consensus)',html:'<p style="margin:0 0 8px;color:var(--ink-3);font-size:12.5px">Distilled from years of r/JapanTravel and r/JapanTravelTips threads. Treat as strong advice, not verified fact.</p><h4>Universal</h4><ul><li>Carry cash: many temples, small shops, ramen counters and Kyoto buses are cash only. 7-Eleven ATMs are everywhere and take foreign cards.</li><li>There are almost no public bins. Carry a small bag for rubbish; konbini bins are for konbini purchases.</li><li>No tipping, anywhere. Trays for cash at the counter; put money on the tray, not in the hand.</li><li>Google Maps is excellent for trains but check the platform and car number: express vs local on the same line is the classic mistake.</li><li>Coin lockers at every big station: ¥400 small, ¥700 large, IC card or coins. Kyoto Station lockers fill by 11:00 on weekends.</li><li>Tax-free needs the passport in hand, minimum ¥5,000 per shop per day; sealed bags stay sealed until you leave Japan.</li><li>Eating while walking is frowned on; stand by the stall. Escalators: stand left in Tokyo, right in Osaka.</li><li>Trains stop around midnight; the last-train scramble is real. Taxis after that are fine but ¥ adds up fast.</li><li>Jet lag from the Gulf and Australia hits on day two; the plan keeps day two light on purpose.</li></ul><h4>Tokyo</h4><ul><li>Skip Shibuya Sky if you cannot get a sunset slot; Mag\'s Park (Shibuya 109 roof, ¥600) or the Tokyo Gov building (free) do the job.</li><li>Kappabashi kitchen street near Asakusa for knives and plastic food replicas; Kama-Asa for a knife engraved on the spot.</li><li>Todoroki Valley: a forested gorge inside the city, 20 minutes from Shibuya, empty on weekdays.</li><li>Kichijoji and Inokashira Park for the local-Tokyo Sunday; Harmonica Yokocho alleys next to the station.</li><li>Nakano Broadway beats Akihabara for retro toys and figures; Mandarake floors are the draw.</li><li>Yanaka Ginza at 16:00 for the sunset steps; Nezu Shrine torii tunnel nearby is Fushimi without the crowds.</li><li>Golden Gai bars charge cover; photograph the alleys and leave unless you want a ¥1,000 seat. Ignore all Kabukicho touts.</li><li>Tsukiji outer market by 08:30; by 10:00 it is a queue. Tamagoyaki on a stick and fruit daifuku.</li><li>Don Quijote: go after 22:00 for no queues; the tax-free counter closes earlier at some branches, ask.</li><li>Depachika (department-store basements) at 19:30 for half-price bento and the best gift sweets: Isetan Shinjuku and Mitsukoshi Ginza.</li></ul><h4>Kyoto and Arashiyama</h4><ul><li>You are staying in Arashiyama, which most visitors only day-trip: the hidden side is north of the grove. Otagi Nenbutsu-ji has 1,200 carved rakan statues, each with a different face, and almost nobody there. Adashino Nenbutsu-ji next to it has 8,000 stone Buddhas. The Saga-Toriimoto preserved street between them is Kyoto without tourists.</li><li>Okochi Sanso villa at the top of the grove: ¥1,000 includes matcha and a sweet, gardens with the city view, and it is where the bamboo crowds turn back.</li><li>Kameyama Park above Togetsukyo: five minutes up, a viewpoint over the gorge, monkeys sometimes.</li><li>Gio-ji: tiny moss garden temple, ten minutes north of the grove, the moss is the point.</li><li>Fushimi Inari before 08:00 is non-negotiable. Kiyomizu at 06:00 opening is the other early trick.</li><li>Kyoto buses are slow and packed; use trains and taxis (cheap for three people) instead.</li><li>Nishiki closes early; Pontocho and the Kamo riverbank are the evening; Gion Shirakawa over Hanamikoji for photos.</li><li>Kinkaku-ji is worth it only at 09:00 opening; after that it is a conveyor belt.</li></ul><h4>Ine and the coast</h4><ul><li>Sea taxi over the big cruise boat, and the funaya cafe upstairs of a boat house for coffee with the water under you.</li><li>Ine e-bikes are rentable at the roadside station if you want the coast road without the car.</li><li>Amanohashidate: the Monju side has the temple and the bike hire; Kasamatsu is the view. Do not try both viewpoints.</li></ul><h4>Okunoshima</h4><ul><li>Weekday visits are calmer and the rabbits hungrier. Bring pellets from the port; vegetables are discouraged now.</li><li>The rabbits near the pier are fed all day; walk ten minutes to the campsite side and they come running.</li><li>The Rabbit Line boat from Mihara port exists but runs a thin schedule; the Tadanoumi route is the reliable one.</li></ul><h4>Nara and Osaka</h4><ul><li>Nara before 10:00, deer are calmer and the crackers last longer; keep paper and maps out of reach.</li><li>Kasuga Taisha lantern corridors and the forest path are quieter than Todai-ji and fifteen minutes away.</li><li>Kuromon market is tourist-priced now; Dotonbori after dark and Hozenji Yokocho for atmosphere; Shinsekai for retro Osaka.</li><li>Osaka trains: Namba and Umeda are different worlds; Hankyu from Umeda is the direct way to Arashiyama.</li></ul><h4>Hakone</h4><ul><li>Do the loop clockwise from Odawara (railway, cable car, ropeway, boat) in the morning and you stay ahead of the tour buses.</li><li>Ropeway shuts for wind and gas alerts more often than people expect; the Open-Air Museum is the standard fallback.</li><li>Freepass covers everything; Romancecar seats sell out on weekends, book the day before.</li></ul><h4>DisneySea</h4><ul><li>Rope drop and the last 90 minutes are the whole strategy; midday is for shows, indoor ports and Mobile Order.</li><li>Fantasy Springs standby shortest at opening; Premier Access sells out by late morning on busy days.</li><li>Popcorn bucket first thing; refills are cheap and the flavour carts are by port.</li><li>Sindbad is the underrated ride; Soaring row 1; Raging Spirits single rider.</li></ul>'},
 {t:'DisneySea playbook (9 Oct)',html:'<h4>Tickets</h4><ul><li>Date-specific 1-Day Passports go on sale two months ahead at 14:00 Japan time on the official site or app; for 9 October that window opened on 9 August, so buy now while stock lasts. Prices vary by date (roughly ¥8,000 to ¥11,000 adult).</li><li>If the standard ticket is sold out, the Fantasy Springs Magic Passport (about three times the price) still tends to be available and includes ride access in the new port without buying Premier Access.</li><li>Buy all three on one Disney account so one phone can pull every pass for the group. Resale tickets are void at the gate.</li></ul><h4>The four pass types</h4><ul><li><b>Standby</b>: the normal line. Anyone, any time.</li><li><b>Disney Premier Access (paid)</b>: ¥1,500 to ¥2,000 per person per ride, bought in the app only after you scan in. First one immediately; the next only after 60 minutes or once the first is used. Sells out by late morning on busy days, Fantasy Springs first.</li><li><b>40th Anniversary Priority Pass (free)</b>: in the app after entry, for the second-tier rides: Indiana Jones, Raging Spirits, Nemo SeaRider, Turtle Talk, Magic Lamp Theater, Mermaid Lagoon Theater. Usually gone by noon. Same 60-minute rule.</li><li><b>Standby Pass (free)</b>: at DisneySea this currently governs shop entry (Emporio, Fantasy Springs Gifts, capsule-toy corners), not rides. Check the app on the morning.</li></ul><h4>The four that must happen</h4><ul><li><b>1. Frozen Journey</b>: Premier Access at minute one.</li><li><b>2. Peter Pan</b>: Premier Access at 10:00, or standby before 10:00 if under 45 min.</li><li><b>3. Rapunzel</b>: rope-drop standby at 09:20, again at night.</li><li><b>4. Journey to the Center of the Earth</b>: standby before lunch if under 60, else third Premier Access.</li><li>Budget if you buy all three paid passes: ¥6,000 per person. Worth it on a Halloween Friday.</li></ul><h4>Full ride list with typical waits</h4><ul><li><b>Frozen Journey</b> (Fantasy Springs): standby 120 to 240; buy Premier Access ¥2,000 at minute one.</li><li><b>Soaring</b> (Mediterranean Harbor): rope-drop standby 30 to 45, midday 90 to 150, last hour 30 to 45.</li><li><b>Journey to the Center of the Earth</b> (Mysterious Island): standby 60 to 120; second Premier Access ¥2,000 if the morning line is long.</li><li><b>Peter Pan\'s Never Land Adventure</b> (Fantasy Springs): standby 90 to 150; Premier Access ¥2,000.</li><li><b>Rapunzel\'s Lantern Festival</b> (Fantasy Springs): standby 60 to 90 before lunch; Premier Access ¥1,500.</li><li><b>Tower of Terror</b> and <b>Toy Story Mania</b> (American Waterfront): 60 to 120 by day, half that after 19:00; Premier Access ¥1,500 each.</li><li><b>Indiana Jones</b> (Lost River Delta): free Priority Pass at minute two.</li><li><b>Raging Spirits</b> (Lost River Delta): use the single-rider line, 10 to 15 minutes.</li><li><b>Sindbad\'s Storybook Voyage</b> (Arabian Coast): 10-minute wait, do not skip.</li><li><b>20,000 Leagues</b>, <b>Aquatopia</b>, <b>Fortress Explorations</b>, <b>Venetian Gondolas</b>, <b>Transit Steamer</b>: short or no waits, use them as rests.</li><li><b>Nemo &amp; Friends SeaRider</b> (Port Discovery): 30 to 60, or a free pass.</li><li><b>Fairy Tinker Bell\'s Busy Buggies</b>: kids ride, standby only, skip.</li></ul><h4>Crowd pattern on a Halloween Friday</h4><ul><li>Cheapest hours: 09:00 to 09:45 and 19:30 to close. Most expensive: 11:30 to 16:00.</li><li>Fantasy Springs is calmest right at opening and after 18:00; the rest of the park empties into it at 10:30.</li><li>Shows and indoor ports (Mermaid Lagoon, theatres) are the mid-afternoon refuge; Big Band Beat seats are by app lottery, enter it as soon as you are in.</li><li>Ride the big harbour rides during the evening show; lines halve while the water show runs.</li><li>Rain is your friend: waits drop by a third and the park stays open.</li></ul><h4>Food</h4><ul><li>Mobile Order from the app for any table-service or counter restaurant; order at 11:00, pick up at your chosen time, no queue.</li><li>Popcorn flavours are tied to carts: curry at Lost River Delta, black pepper and garlic shrimp around the harbour, caramel at Cape Cod, sea salt at Mermaid Lagoon. Buckets refill for about ¥600.</li><li>Sweets are safe; the gyoza dog, sausages and most hot snacks are pork. Chicken and beef counter meals at Fantasy Springs and Cape Cod are the reliable meals.</li></ul><h4>Map and getting around</h4><ul><li><a class="mapbtn" href="https://www.tokyodisneyresort.jp/en/tds/map/" target="_blank" rel="noopener">Official DisneySea park map ↗</a> <a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=Tokyo+DisneySea" target="_blank" rel="noopener">Google Maps ↗</a></li><li>The park is a loop around Mediterranean Harbor with the volcano in the middle. Walking clockwise from the entrance: Mediterranean Harbor, American Waterfront, Port Discovery, Lost River Delta, Fantasy Springs (far east), Arabian Coast, Mermaid Lagoon, Mysterious Island (inside the volcano), back to the harbour. A full lap on foot is about 25 minutes.</li><li>Shortcut through the volcano: the two tunnels into Mysterious Island connect Mediterranean Harbor and Mermaid Lagoon and save five minutes each way.</li><li>DisneySea Transit Steamer Line: boats between Mediterranean Harbor, American Waterfront and Lost River Delta every 10 to 15 minutes; free, a sit-down, and the best way back from the east side.</li><li>DisneySea Electric Railway: elevated tram between American Waterfront and Port Discovery, 5 minutes.</li><li>The official app map shows your position, live wait times and show times; screenshot the paper map as a backup.</li></ul><h4>Every ride, what it is</h4><ul><li><b>Rapunzel\'s Lantern Festival</b> (Fantasy Springs): slow boat through the forest to the lantern festival, 7 min, no drops, no height limit. The lantern room is the best scene in the park. Standby or Premier Access ¥1,500.</li><li><b>Anna and Elsa\'s Frozen Journey</b> (Fantasy Springs): boat ride with two drops through the Frozen story and full soundtrack, 6 min. Longest line in the park. Premier Access ¥2,000.</li><li><b>Peter Pan\'s Never Land Adventure</b> (Fantasy Springs): 3D flying-boat ride over Never Land, 6 min. Premier Access ¥2,000.</li><li><b>Fairy Tinker Bell\'s Busy Buggies</b> (Fantasy Springs): gentle kids ride through Pixie Hollow, standby only.</li><li><b>Soaring: Fantastic Flight</b> (Mediterranean Harbor): suspended flying theatre over world landmarks with wind and scents, 5 min, 102 cm. Premier Access ¥2,000.</li><li><b>Venetian Gondolas</b> (Mediterranean Harbor): rowed gondola around the canals, 10 min, short waits.</li><li><b>Fortress Explorations</b> (Mediterranean Harbor): walk-through fortress and galleon with puzzles; no queue.</li><li><b>Journey to the Center of the Earth</b> (Mysterious Island): drill vehicle through crystal caves, one big drop and a fast finale out of the volcano, 3 min, 117 cm. Premier Access ¥2,000.</li><li><b>20,000 Leagues Under the Sea</b> (Mysterious Island): dark submarine ride, 5 min, no height limit, rarely over 25 minutes.</li><li><b>Flounder\'s Flying Fish Coaster</b> (Mermaid Lagoon): small outdoor coaster, 90 cm, 1 min.</li><li><b>Scuttle\'s Scooters, Jumpin\' Jellyfish, Blowfish Balloon Race, The Whirlpool</b> (Mermaid Lagoon): four indoor gentle rides, 5-minute waits, good for the afternoon crush.</li><li><b>Mermaid Lagoon Theater</b>: Ariel musical with puppetry, 15 min, Priority Pass.</li><li><b>Sindbad\'s Storybook Voyage</b> (Arabian Coast): slow boat with an original song by Alan Menken, 10 min, 10-minute wait, the underrated one.</li><li><b>The Magic Lamp Theater</b> (Arabian Coast): 3D Genie comedy show, 25 min, Priority Pass.</li><li><b>Caravan Carousel</b> (Arabian Coast): two-storey carousel, no wait.</li><li><b>Jasmine\'s Flying Carpets</b> (Arabian Coast): spinning carpets, 5 to 15 min.</li><li><b>Indiana Jones Adventure: Temple of the Crystal Skull</b> (Lost River Delta): fast jeep through the temple with a boulder finale, 3 min, 117 cm, Priority Pass.</li><li><b>Raging Spirits</b> (Lost River Delta): 360-degree loop coaster, 90 sec, 117 cm, single-rider line.</li><li><b>DisneySea Transit Steamer Line</b>: the boats; ride once for the harbour view.</li><li><b>Aquatopia</b> (Port Discovery): water vehicles skating over a shallow pool, 3 min, choose the wet course if warm.</li><li><b>Nemo &amp; Friends SeaRider</b> (Port Discovery): motion simulator shrunk to fish size, 5 min, Priority Pass.</li><li><b>DisneySea Electric Railway</b>: the tram.</li><li><b>Tower of Terror</b> (American Waterfront): haunted-hotel drop tower, three drops, 2 min, 102 cm. Premier Access ¥1,500.</li><li><b>Toy Story Mania!</b> (American Waterfront): 3D shooting-gallery ride, 3 min, scores compete. Premier Access ¥1,500.</li><li><b>Turtle Talk</b> (American Waterfront): live animated Crush chats with the audience, 15 min, Priority Pass.</li><li><b>Big City Vehicles</b> (American Waterfront): vintage car ride around the port, short wait.</li><li><b>Big Band Beat</b> (American Waterfront): 30-minute live jazz stage show, seats by app lottery.</li><li><b>Duffy and Friends show</b> (Cape Cod): short stage show, lottery.</li></ul><h4>Port by port, everything there is</h4><ul><li><b>Mediterranean Harbor</b>: Soaring; Venetian Gondolas; Fortress Explorations; DisneySea Transit Steamer; Zambini Brothers\' Ristorante (pizza, pasta); Cafe Portofino; Magellan\'s (fine dining, reserve); Emporio, Galleria Disney, Il Postino; harbour shows morning and night.</li><li><b>Mysterious Island</b>: Journey to the Center of the Earth; 20,000 Leagues Under the Sea; Vulcania Restaurant; Nautilus Galley (gyoza dog is pork); Refreshment Station (Tipo Torta); Mount Prometheus eruptions on the hour.</li><li><b>Mermaid Lagoon</b>: Flounder\'s Flying Fish Coaster; Scuttle\'s Scooters; Jumpin\' Jellyfish; Blowfish Balloon Race; The Whirlpool; Ariel\'s Playground; Mermaid Lagoon Theater (Priority Pass); Sebastian\'s Calypso Kitchen; sea salt ice cream cart.</li><li><b>Arabian Coast</b>: Sindbad\'s Storybook Voyage; The Magic Lamp Theater (Priority Pass); Caravan Carousel; Jasmine\'s Flying Carpets; Casbah Food Court (curry, chicken or beef); Sultan\'s Oasis; Open Sesame churros; Agrabah Marketplace.</li><li><b>Lost River Delta</b>: Indiana Jones Adventure (Priority Pass); Raging Spirits (single rider); Transit Steamer dock; Yucatan Base Camp Grill (turkey leg); Miguel\'s El Dorado Cantina; curry popcorn.</li><li><b>Fantasy Springs</b>: Anna and Elsa\'s Frozen Journey; Rapunzel\'s Lantern Festival; Peter Pan\'s Never Land Adventure; Fairy Tinker Bell\'s Busy Buggies; Lost Boys hideout; Royal Banquet of Arendelle (Mobile Order); Oaken\'s OK Foods; Snuggly Duckling; Lookout Cookout; Fantasy Springs Gifts (Standby Pass at peak).</li><li><b>Port Discovery</b>: Aquatopia; Nemo &amp; Friends SeaRider (Priority Pass); Electric Railway; Seaside Snacks (sea salt monaka); Horizon Bay Restaurant.</li><li><b>American Waterfront</b>: Tower of Terror; Toy Story Mania; Turtle Talk (Priority Pass); Big City Vehicles; Electric Railway; S.S. Columbia and Teddy Roosevelt Lounge; Broadway Music Theatre (Big Band Beat, lottery); Cape Cod with Duffy & Friends and Cape Cod Cook-Off; McDuck\'s Department Store; Steamboat Mickey\'s; New York Deli (pastrami, skip).</li></ul><h4>Snack checklist (tick as you go)</h4><ul><li>Sea salt ice cream monaka</li><li>Tipo Torta</li><li>Curry popcorn, then one more flavour</li><li>Smoked turkey leg</li><li>Churros</li><li>Mickey ice bar</li><li>Snuggly Duckling donut</li><li>A Halloween-only sweet from any cart</li></ul><h4>Logistics</h4><ul><li>Gates: arrive 07:30 for a 09:00 opening; they open 15 to 30 minutes early on busy days.</li><li>Bags are opened at security; keep it small. Lockers by the entrance ¥400 to ¥800 if you want to drop a layer.</li><li>Leaving at 21:00 is a 20-minute platform crush at Maihama; let two trains go, or eat in the resort area first.</li><li>The app needs a Disney account and works on foreign numbers; set it up and log in before the day.</li></ul>'},
 {t:'Bookings tracker',chk:BOOKINGS.map(b=>`<b>${b.t}</b><br><span style="font-size:12px;color:var(--ink-3)">Book: ${b.by}${b.note?' · '+b.note:''}</span>`)},
 {t:'Capsule wardrobe',chk:['4 to 5 T-shirts','2 long-sleeves','2 trousers','1 nicer trouser or jean','1 lightweight jacket','1 rain shell','1 slightly smarter outfit','2 pairs of shoes','7 to 8 underwear','7 to 8 socks']},
 {t:'Daily day-bag',chk:['Passport','Power bank','Phone','Cash and card','Umbrella','Water','Tissues','Hand sanitiser','Small snack','Translation app','Hotel address screenshot']},
 {t:'Food bucket list',html:'<h4>Tokyo</h4><ul><li>Halal wagyu yakiniku (GYUMON)</li><li>Halal wagyu ramen</li><li>Japanese curry</li><li>Matcha dessert</li><li>Konbini egg sandwich and onigiri</li></ul><h4>Kyoto</h4><ul><li>Matcha, yatsuhashi</li><li>Tamagoyaki at Nishiki</li><li>Kaiseki splurge (Honke Tankuma, reserve ahead)</li><li>Kyoto udon</li></ul><h4>Nara</h4><ul><li>Nakatanidou mochi, kakinoha-zushi, cha-gayu</li></ul><h4>Osaka</h4><ul><li>Takoyaki, okonomiyaki, kushikatsu, verified halal versions only</li></ul>'},
 {t:'Halal near the Tokyo hotel (running index)',html:'<p style="margin:0 0 8px;font-size:13px;color:var(--ink-3)">From Mitsui Garden Hotel Jingugaien. Minutes are door to door. Confirm certification on the day; places change.</p><ul><li><b>Honolu Ramen</b>, Shinjuku-Gyoenmae · 15 min · halal ramen · in the plan 17 Oct</li><li><b>Shinjuku Gyoen Ramen Ouka</b> · 15 min · halal shio ramen, no alcohol</li><li><b>Yakiniku Panga</b>, Shinjuku · 15 min · halal Korean yakiniku</li><li><b>GYUMON</b>, Shibuya · 12 min · halal A5 wagyu · in the plan 8 and 18 Oct</li><li><b>Sumiyakiya</b>, Nishi-Azabu · 15 min by taxi · halal yakiniku, upscale</li><li><b>CoCo Ichibanya Halal</b>, Akihabara · 20 min · halal Japanese curry</li><li><b>Ayam-Ya</b>, Okachimachi · 25 min · halal chicken ramen, by Ameyoko</li><li><b>Naritaya</b> and <b>CANOW</b>, Asakusa · 35 min · halal ramen and wagyu</li></ul><p style="margin:10px 0 0;font-size:13px;color:var(--ink-3)">Each has a place page with menu picks; search "halal" on the Places screen.</p>'},
 {t:'Halal food guide',html:'<h4>Kyoto official tiers</h4><ul><li><b>Halal</b>: all food halal</li><li><b>Muslim Friendly</b>: designated halal menu</li><li><b>Muslim Welcome</b>: no pork, no alcohol flavouring</li><li><b>Pork-Free</b>: no pork, alcohol flavouring possible</li></ul><h4>Reliable stops</h4><ul><li>Tokyo: GYUMON (Shibuya, wagyu yakiniku and ramen), CANOW and HALAL-Ya (Asakusa), Honolu (Shinjuku ramen)</li><li>Kyoto: Raju (fully halal), Istanbul Saray, Honke Tankuma kaiseki by reservation</li><li>Nara: GYUMON Nara</li><li>Osaka: Ali\'s Kitchen (Shinsaibashi)</li><li>Ine, Okunoshima, DisneySea: carry your own</li></ul>'},
 {t:'If tired: keep vs cut',html:'<h4>Never cut</h4><ul><li>Asakusa, Shibuya at night, DisneySea</li><li>Fushimi Inari early, Kiyomizu + the slopes, Gion</li><li>Ine, Rabbit Island</li><li>Nara deer + Todai-ji, Dotonbori</li><li>teamLab, JDM night, one major shopping day</li></ul><h4>Cut first</h4><ul><li>Tokyo Skytree, Tokyo Tower</li><li>Osaka Castle, extra temples</li><li>Second shopping centre, optional museums</li><li>Hakone</li></ul>'},
 {t:'What to buy where',html:'<ul><li><b>Asakusa</b>: crafts, fans, maneki-neko, sweets</li><li><b>Harajuku / Shibuya</b>: streetwear, sneakers, character goods</li><li><b>Akihabara</b>: electronics, gaming, anime</li><li><b>Kyoto</b>: matcha, ceramics, fans, knives</li><li><b>Ine</b>: maritime regional goods</li><li><b>Tadanoumi</b>: rabbit goods</li><li><b>Nara</b>: deer goods, brushes, sweets</li><li><b>Osaka</b>: snacks, novelties</li><li><b>Tokyo final days</b>: everything else, bulk</li></ul>'},
 {t:'Photos still needed',html:'<p style="margin:0 0 6px">Everything else has a photo. These still need one: send Claude an image for each.</p><ul id="imgList"></ul>'}
];

async function weather(day){

const ACCENT={oct07:'#1B1B1B',oct08:'#1B1B1B',oct09:'#2B5FB3',oct10:'#B8402A',oct11:'#B8402A',oct12:'#2A6FA8',oct13:'#2E8B67',oct14:'#B8402A',oct15:'#1B1B1B',oct16:'#1B1B1B',oct17:'#1B1B1B',oct18:'#1B1B1B',oct19:'#1B1B1B'};
const variantSel={};
function openDay(id,vi){
  const base=DAYS.find(d=>d.id===id);if(!base)return;
  if(vi!==undefined)variantSel[id]=vi;
  const day=base.variants?Object.assign({},base,base.variants[variantSel[id]||0]):base;
  document.documentElement.style.setProperty('--accent',ACCENT[id]||'#1B1B1B');document.body.classList.toggle('party',id==='oct09');document.querySelector('meta[name=theme-color]').content=id==='oct09'?'#EDEDE8':(document.documentElement.classList.contains('dark')?'#121212':'#EEEEEA');
  const seg=document.getElementById('seg');
  if(base.variants){const cur=variantSel[id]||0;seg.classList.remove('hidden');seg.classList.toggle('b',cur===1);seg.innerHTML=`<span class="pill"></span>`+base.variants.map((v,i)=>`<button class="${i===cur?'on':''}" onclick="openDay('${id}',${i})">${v.label}</button>`).join('');}else seg.classList.add('hidden');
  const switching=curDay&&document.getElementById('day').classList.contains('active');const sameDay=curDay&&curDay.id===day.id;curDay=day;
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('day').classList.add('active');
  if(sameDay){}else if(switching){const top=document.querySelector('.sheet').offsetTop-4;window.scrollTo(0,Math.min(window.scrollY,top));}else window.scrollTo(0,0);
  const gal=document.getElementById('gal');gal.innerHTML='';day.hero.forEach(k=>gal.appendChild(mkImg(k,'hero')));
  const gd=document.getElementById('gdots');gd.innerHTML=day.hero.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  const cap=document.getElementById('cap');let capI=-1;const setCap=i=>{if(i===capI)return;capI=i;cap.classList.add('sw');setTimeout(()=>{cap.classList.remove('sw');},220);const k=day.hero[i];cap.innerHTML=`<div class="k">${i+1} of ${day.hero.length}</div><div class="n">${P[k]?P[k][0]:''}</div>`;[...gd.children].forEach((d,j)=>d.classList.toggle('on',j===i));};
  let gcur=0;const gn=day.hero.length;
  const gcount=document.getElementById('gcount');const goTo=(n,anim=true)=>{gcur=Math.max(0,Math.min(gn-1,n));gcount.textContent=`${gcur+1} / ${gn}`;gal.style.transition=anim?'transform .38s var(--ease)':'none';gal.style.transform=`translateX(${-gcur*100}%)`;setCap(gcur);document.getElementById('gprev').disabled=gcur===0;document.getElementById('gnext').disabled=gcur===gn-1;};
  gal.style.transform='none';goTo(0,false);
  const gp=document.getElementById('gprev'),gnx=document.getElementById('gnext');gp.onclick=e=>{e.stopPropagation();goTo(gcur-1);};gnx.onclick=e=>{e.stopPropagation();goTo(gcur+1);};gp.onpointerdown=gnx.onpointerdown=e=>e.stopPropagation();
  [...gd.children].forEach((d,i)=>{d.onclick=()=>goTo(i);});
  let sx=0,sy=0,dx=0,drag=false,axis=null;const w=()=>gal.clientWidth||1;
  gal.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=true;axis=null;gal.setPointerCapture&&gal.setPointerCapture(e.pointerId);gal.style.transition='none';};
  gal.onpointermove=e=>{if(!drag)return;if(e.pointerType==='mouse'&&e.buttons===0){end();return;}const mx=e.clientX-sx,my=e.clientY-sy;if(!axis){if(Math.abs(mx)>6||Math.abs(my)>6)axis=Math.abs(mx)>Math.abs(my)?'x':'y';else return;}if(axis!=='x')return;dx=mx;const edge=(gcur===0&&dx>0)||(gcur===gn-1&&dx<0);gal.style.transform=`translateX(calc(${-gcur*100}% + ${edge?dx*0.35:dx}px))`;};
  const end=()=>{if(!drag)return;drag=false;if(axis==='x'&&Math.abs(dx)>w()*0.18)goTo(gcur+(dx<0?1:-1));else goTo(gcur);};
  gal.onpointerup=end;gal.onpointercancel=end;gal.onpointerleave=end;window.addEventListener('pointerup',end,{passive:true});
  document.onkeydown=e=>{if(!document.getElementById('day').classList.contains('active'))return;if(e.key==='ArrowRight')goTo(gcur+1);if(e.key==='ArrowLeft')goTo(gcur-1);};
  const sw=document.getElementById('dsw');
  if(!sw.dataset.built){sw.innerHTML=DAYS.map(d=>`<button data-id="${d.id}" onclick="openDay('${d.id}')" aria-label="${d.d}"><small>${d.short.split(' ')[0]}</small><b>${d.short.split(' ')[1]}</b>${d.variants?'<span class="v" title="Two options"></span>':''}</button>`).join('');sw.dataset.built='1';}
  sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===day.id));
  const onb=sw.querySelector('.on');if(onb){const left=onb.offsetLeft-sw.clientWidth/2+onb.offsetWidth/2;sw.scrollTo({left:Math.max(0,left),behavior:switching?'smooth':'auto'});}
  // directional slide of the sheet content when moving between days
  const body=document.getElementById('sheetBody');const prevIdx=DAYS.findIndex(d=>d.id===(window.__lastDay||day.id));const dir=DAYS.findIndex(d=>d.id===day.id)-prevIdx;window.__lastDay=day.id;
  if(switching&&!sameDay){body.classList.remove('sl','sr');void body.offsetWidth;body.classList.add(dir>0?'sl':'sr');body.dataset.nostagger='1';}else{body.classList.remove('sl','sr');delete body.dataset.nostagger;}
  document.getElementById('dayPill').textContent=`Day ${String(day.n).padStart(2,'0')} of ${DAYS.length}`;
  document.getElementById('dDate').textContent=day.d;
  document.getElementById('dTitle').textContent=day.title;
  document.getElementById('dDesc').textContent=day.desc;
  document.getElementById('dStats').innerHTML=[...day.stats,[String(day.stops.length),'Planned stops']].map(s=>`<div class="stat"><div class="v">${s[0]}</div><div class="l">${s[1]}</div></div>`).join('');
  const tips=document.getElementById('dTips');tips.innerHTML=day.tips.map(t=>`<div class="slide"><div class="tip" role="button" tabindex="0"><span class="orb k-${t.k}"></span><p><b>${t.h}</b>${t.t?' '+t.t:''}</p></div></div>`).join('');tips.querySelectorAll('.tip').forEach(el=>el.onclick=()=>el.classList.toggle('x'));
  const dots=document.getElementById('dDots');dots.innerHTML=day.tips.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');tips.scrollLeft=0;
  tips.onscroll=()=>{const i=Math.round(tips.scrollLeft/tips.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));};
  // good to know (Klook-style info chips), derived from the day's data
  const modes={};day.stops.forEach(x=>{if(x.go&&x.go.m)modes[x.go.m]=(modes[x.go.m]||0)+1;});
  const walkMin=day.stops.reduce((a,x)=>{if(x.go&&x.go.m==='walk'&&x.go.t){const m=parseInt(x.go.t);if(!isNaN(m))return a+m;}return a;},0);
  const booked=day.stops.filter(x=>x.cat==='booked').length;const first=day.stops[0]?day.stops[0].t:'';const last=day.stops[day.stops.length-1]?day.stops[day.stops.length-1].t:'';
  const gtk=[[I.clock,`${first} to ${last}`,'Day span'],[I.train,Object.entries(modes).filter(([m])=>m!=='walk').map(([m,n])=>`${n} ${m}`).join(' · ')||'On foot','Transfers'],[GI.walk,walkMin?`~${walkMin} min`:'Light','Walking between stops'],[I.ticket,booked?`${booked} to book`:'None','Reservations'],[I.sun,`${day.wx.t}° ${day.wx.c}`,'Forecast estimate']];
  document.getElementById('dGtk').innerHTML=gtk.map(g=>`<div class="g">${g[0]}<div><b>${g[1]}</b><small>${g[2]}</small></div></div>`).join('');
  const musts=day.stops.map((x,i)=>[x,i]).filter(([x])=>x.must);
  document.getElementById('dHl').innerHTML=musts.length?`<div class="h">Highlights</div>`+musts.map(([x,i])=>`<button onclick="(function(){const el=document.querySelectorAll('#dStops .stop')[${i}];if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});}})()"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span>${x.n}</span><small>${x.t}</small></button>`).join(''):'';
  const nowIdx=nowStopIndex(day);
  document.getElementById('dCnt').innerHTML=I.star+day.stops.filter(s=>s.must).length+' must-see · share';
  const tl=document.getElementById('dStops');tl.innerHTML='';
  day.stops.forEach((s,i)=>{
    const place=s.p&&P[s.p]?P[s.p][0]:'';
    if(s.go&&(s.go.t||s.go.d)){const gdiv=document.createElement('button');gdiv.className='go';gdiv.style.setProperty('--i',i);gdiv.innerHTML=`<span class="gi">${GI[s.go.m]||I.train}</span><span class="gt"><b>${GL[s.go.m]||''}${s.go.t?' · '+s.go.t:''}</b>${s.go.d?`<span class="gd">${s.go.d}</span>`:''}</span>${s.go.d?`<span class="gc">${I.chev}</span>`:''}`;if(s.go.d)gdiv.onclick=()=>gdiv.classList.toggle('open');tl.appendChild(gdiv);}
    const st=document.createElement('div');st.className='stop open'+(i<nowIdx?' done':'');
    const tags=[i===nowIdx?'<span class="tag now">Now</span>':'',s.must?'<span class="tag must">Must see</span>':'',s.cat==='booked'?'<span class="tag booked">To book</span>':'',s.halal?'<span class="tag halal">Halal</span>':'',s.opt?'<span class="tag opt">Optional</span>':''].filter(Boolean).join('');
    const maps=place?`<div class="btnrow"><a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Maps ${I.ext}</a><button class="mapbtn alt2" onclick="event.stopPropagation();window.__pdFrom='day';openPlace('${s.p}')">Place page ${I.ext}</button></div>`:'';
    const more=`<div class="acts"><button class="donebtn" data-k="${'done:'+day.id+':'+i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span>Mark done</span></button><label class="photobtn">${I.photo}<span>Add photo</span><input type="file" accept="image/*" capture="environment" data-k="${'photo:'+day.id+':'+i}"></label></div><div class="myphoto" data-k="${'photo:'+day.id+':'+i}"></div>${s.m?`<p class="why">${s.m}</p>`:''}${s.guide?`<div class="guide"><span class="orb"></span><p><b>Local pick.</b> ${s.guide}</p></div>`:''}${sec('See',I.eye,s.see)}${sec('Eat',I.food,s.eat)}${sec('Buy',I.bag,s.buy)}${sec('Insider tip',I.bulb,s.tip,'tipbox')}${maps}`;
    const dkey='done:'+day.id+':'+i;const isDone=localStorage.getItem(dkey)==='1';if(isDone)st.classList.add('done');
    st.innerHTML=`<div class="ic" style="background:${CATC[s.cat]};--ring:color-mix(in srgb,${CATC[s.cat]} 22%,var(--bg))">${I[CATI[s.cat]]}</div><div class="card" role="button" tabindex="0" aria-expanded="true"><div class="bd"><span class="chev">${I.chev}</span><div class="nm">${s.n}</div>${tags?`<div class="tags">${tags}</div>`:''}<div class="meta"><span>${I.clock}${s.t}</span>${s.best?`<span class="best">${I.sun}<em>${s.best}</em></span>`:''}${place?`<span class="pl">${I.pin}<em>${place}</em></span>`:''}</div><div class="more"><div class="inner">${more}</div></div></div></div>`;
    const inner=st.querySelector('.more .inner');if(s.p==='hotel')inner.prepend(mkImg('tokyohotel'));else if(s.p==='airbnb')inner.prepend(mkImg('kyotoapt'));else if(s.key&&s.p&&P[s.p][0]!=='')inner.prepend(mkImg(s.p));
    st.style.setProperty('--i',i);
    const db=st.querySelector('.donebtn');const syncDone=()=>{const d=localStorage.getItem(db.dataset.k)==='1';st.classList.toggle('done',d);db.classList.toggle('on',d);db.querySelector('span').textContent=d?'Done':'Mark done';};syncDone();
    db.onclick=e=>{e.stopPropagation();const d=localStorage.getItem(db.dataset.k)==='1';localStorage.setItem(db.dataset.k,d?'0':'1');syncDone();updateProgress();if(navigator.vibrate)navigator.vibrate(12);};
    const pin=st.querySelector('.photobtn input');const mp=st.querySelector('.myphoto');const showPhoto=()=>{const u=localStorage.getItem(pin.dataset.k);mp.innerHTML=u?`<img src="${u}" alt=""><button class="rm" aria-label="Remove photo">×</button>`:'';if(u){mp.querySelector('.rm').onclick=e=>{e.stopPropagation();localStorage.removeItem(pin.dataset.k);showPhoto();};}};showPhoto();
    pin.onclick=e=>e.stopPropagation();pin.onchange=()=>{const f=pin.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.setItem(pin.dataset.k,c.toDataURL('image/jpeg',.72));}catch(e){alert('Phone storage for photos is full; remove one first.');}showPhoto();};im.src=r.result;};r.readAsDataURL(f);};
    st.querySelector('.card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){if(e.target!==st.querySelector('.card'))return;e.preventDefault();st.querySelector('.card').click();}};st.querySelector('.card').onclick=e=>{if(e.target.closest('a')||e.target.closest('.acts')||e.target.closest('.myphoto'))return;st.classList.toggle('open');st.querySelector('.card').setAttribute('aria-expanded',st.classList.contains('open'));};
    tl.appendChild(st);
  });
  const chip=document.getElementById('nextchip');chip.classList.add('hidden');
  if(day.id===todayId()){const n=jstNow();const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    const line=document.createElement('div');line.className='nowline';line.innerHTML=`<span>NOW ${hm}</span>`;
    const stops=tl.querySelectorAll('.stop');if(nowIdx>=0&&stops[nowIdx])stops[nowIdx].after(line);else tl.prepend(line);
    const next=day.stops[nowIdx+1];chip.classList.remove('hidden');chip.innerHTML=`<span class="dot"></span>${next?`Next <b>${next.t} · ${next.n}</b>`:'<b>Last stop of the day</b>'}`;}
  const cnt=document.getElementById('dCnt');cnt.style.cursor='pointer';cnt.title='Share this day';cnt.onclick=()=>{const txt=`${day.d} · ${day.title}\n`+day.stops.map(x=>`${x.t} ${x.n}`).join('\n')+`\nhttps://ashikm22.github.io/japan-2026/#${day.id}`;if(navigator.share)navigator.share({title:day.title,text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);cnt.querySelector('span')&&0;alert('Day copied');}};
  const e=day.ess;
  document.getElementById('dEss').innerHTML=`<h3>Wear today</h3><div class="chips">${e.wear.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Eat</h3><div class="chips">${e.eat.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Buy here</h3><div class="chips">${e.buy.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
  const pts=[];const seen=new Set();day.stops.forEach(s=>{if(s.p&&P[s.p]&&P[s.p][0]!==''&&!seen.has(s.p)){seen.add(s.p);pts.push(P[s.p][0]);}});
  const cta=document.getElementById('cta');
  if(pts.length>=2){const w=pts.slice(1,-1).slice(0,9);cta.href=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pts[0])}&destination=${encodeURIComponent(pts[pts.length-1])}${w.length?'&waypoints='+encodeURIComponent(w.join('|')):''}&travelmode=${day.mode}`;cta.style.display='flex';document.getElementById('ctaTxt').textContent=day.id===todayId()?"Start today's route":'Open route in Maps';}else cta.style.display='none';
  weather(day);location.hash=day.id;updateProgress();
}
document.getElementById('backBtn').onclick=()=>{document.body.classList.remove('party');document.querySelector('meta[name=theme-color]').content=document.documentElement.classList.contains('dark')?'#121212':'#EEEEEA';document.getElementById('day').classList.remove('active');document.getElementById('overview').classList.add('active');window.scrollTo(0,0);history.replaceState(null,'',' ');};
/* ---------- motion helpers ---------- */
(function(){
  const dsw=document.getElementById('dsw');const sent=document.createElement('div');sent.style.cssText='height:1px;margin-top:-1px';dsw.parentNode.insertBefore(sent,dsw);
  if('IntersectionObserver' in window)new IntersectionObserver(([e])=>dsw.classList.toggle('stuck',!e.isIntersecting&&e.boundingClientRect.top<0)).observe(sent);
  const gal=document.getElementById('gal');const hero=document.querySelector('.hero');const cta=document.getElementById('cta');
  let lastY=0,ticking=false;const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=window.scrollY;
    if(!rm&&window.innerWidth<900&&document.getElementById('day').classList.contains('active')){const hh=hero.offsetHeight;if(y<hh)hero.style.setProperty('--py',`${y*0.28}px`);}
    if(window.innerWidth<900){if(y>240&&y>lastY+6)cta.classList.add('hide');else if(y<lastY-6||y<240)cta.classList.remove('hide');}
    lastY=y;ticking=false;});},{passive:true});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
setInterval(()=>{if(curDay&&curDay.id===todayId()&&document.getElementById('day').classList.contains('active')){const y=window.scrollY;openDay(curDay.id);window.scrollTo(0,y);}},60000);
document.body.classList.add('sky');renderOverview();renderPlaces();






const h0=location.hash.replace('#','');if(h0&&DAYS.find(d=>d.id===h0))openDay(h0);else if(h0==='places')openPlaces();else if(h0.startsWith('place-')){if(!PLACES)PLACES=buildPlaces();window.__pdFrom='placespg';openPlace(h0.slice(6));}
(function(){if(!PLACES)PLACES=buildPlaces();const pc=document.getElementById('ppCount');if(pc)pc.textContent=`${PLACES.length} places and things to know`;})();
</script>
