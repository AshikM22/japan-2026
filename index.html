<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F8F6">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<title>Japan 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F7F7F7;            /* page, warm off-white */
  --surface:#FFFFFF;
  --tint:#F1F1EE;          /* chips, quiet fills */
  --line:#ECECE8;
  --ink:#141414;
  --ink-2:#6B6B6B;
  --ink-3:#9A9A98;
  --sh-1:0 2px 10px rgba(0,0,0,.05);
  --sh-2:0 8px 24px rgba(0,0,0,.08);
  --r-s:10px;--r-m:14px;--r-l:20px;
  --c-transport:#3B82F6;--c-food:#F59E42;--c-attraction:#EF6A4C;--c-hotel:#7C6CE0;--c-shopping:#EC5A93;--c-nature:#3CB371;--c-booked:#D9A520;--c-coffee:#9C6B4A;--c-flex:#9A9A98;
  --pad:24px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.screen{display:none}.screen.active{display:block}

/* ============ image frames ============ */
.img{position:relative;overflow:hidden;background:#EDEDEA;background-size:cover;background-position:center}
.img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C2C2BD;background:linear-gradient(160deg,#EFEFEC 0%,#E4E4DF 100%)}
.img .ph svg{width:26px;height:26px}
.img .ph small{position:absolute;right:8px;bottom:6px;font-size:10px;color:#A4A4A0;font-weight:500}
.img.loaded .ph{display:none}
.img .credit{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.28);padding:2px 6px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1}
.gal .img .credit{bottom:56px;right:var(--pad)}
.daycard .img .credit,.strip .img .credit{display:none}

/* ============ overview ============ */
.ov{padding:0 var(--pad) calc(var(--sab) + 40px)}
.ov-top{padding-top:calc(var(--sat) + 28px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ov-top h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:0}
.ov-top .sub{font-size:13px;color:var(--ink-2);margin-top:6px;font-weight:500}
.cover{margin-top:18px;border-radius:var(--r-l);height:190px;box-shadow:var(--sh-2)}
.cover .ph svg{width:32px;height:32px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag-c{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.tag-c svg{width:13px;height:13px;color:var(--ink-3)}
.h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:28px 0 12px}
.daycard{display:flex;gap:14px;align-items:center;width:100%;background:var(--surface);border-radius:var(--r-l);padding:12px;box-shadow:var(--sh-1);margin-bottom:10px;position:relative}
.daycard .img{width:76px;height:76px;border-radius:12px;flex:0 0 auto}
.daycard .img .ph svg{width:20px;height:20px}.daycard .img .ph small{display:none}
.daycard .txt{flex:1;min-width:0}
.daycard .k{font-size:11.5px;color:var(--ink-3);font-weight:500}
.daycard .t{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:3px 0 7px;color:var(--ink)}
.meta-row{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.meta-row span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meta-row svg{width:13px;height:13px;color:var(--ink-3)}
.daycard .today{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.note{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);margin-bottom:10px;overflow:hidden}
.note summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:15px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:52px}
.note summary::-webkit-details-marker{display:none}
.note summary svg{transition:transform .2s;color:var(--ink-3);flex:0 0 auto;width:18px;height:18px}
.note[open] summary svg{transform:rotate(180deg)}
.note .body{padding:0 14px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.note .body h4{margin:12px 0 5px;font-size:13px;color:var(--ink);font-weight:600}
.note .body ul{margin:0;padding-left:0;list-style:none}.note .body li{padding:3px 0}
.chk{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--ink);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:0 0 auto}
.chk input:checked+span{color:var(--ink-3);text-decoration:line-through}

/* ============ day: hero ============ */
.hero{position:relative;height:40vh;min-height:280px;max-height:400px;overflow:hidden;background:#E9E9E5}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .img{flex:0 0 100%;height:100%;scroll-snap-align:start}
.gal .img .ph svg{width:40px;height:40px}
.gal .img .ph small{bottom:52px;right:var(--pad)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 60%,rgba(0,0,0,.40) 100%)}
.hero .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:44px;color:#fff;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .cap .k{font-size:12px;font-weight:500;opacity:.85}
.hero .cap .n{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:2px}
.gdots{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.gdots i{width:5px;height:5px;border-radius:999px;background:rgba(255,255,255,.45)}.gdots i.on{background:#fff}
.fab{position:absolute;z-index:5;height:44px;min-width:44px;border-radius:999px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.fab.back{top:calc(var(--sat) + 12px);left:16px;width:44px}
.garr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:.9}
.garr.l{left:12px}.garr.r{right:12px}
.garr[disabled]{opacity:.3}
@media (hover:none) and (max-width:899px){.garr{width:34px;height:34px;top:auto;bottom:88px;transform:none;background:rgba(0,0,0,.28);color:#fff;box-shadow:none}}
.fab.pill{top:calc(var(--sat) + 12px);right:16px;padding:0 14px;font-size:13px;font-weight:600}

/* ============ day: sheet ============ */
.sheet{position:relative;z-index:2;background:var(--bg);border-radius:22px 22px 0 0;margin-top:-22px;padding:0 var(--pad) calc(var(--sab) + 100px)}
.dsw{position:sticky;top:0;z-index:6;margin:0 calc(var(--pad) * -1) 18px;padding:12px var(--pad) 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-radius:22px 22px 0 0}
.dsw::-webkit-scrollbar{display:none}
.dsw::after{content:"";flex:0 0 1px}
.dsw button{flex:0 0 auto;width:46px;height:50px;border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;color:var(--ink)}
.dsw button small{font-size:10px;font-weight:500;color:var(--ink-3);text-transform:none}
.dsw button b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dsw button.on{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.dsw button.on small{color:rgba(255,255,255,.6)}
.daterow{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px;font-weight:500}
.daterow svg{width:15px;height:15px;color:var(--ink-3)}
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:6px}
.titlerow h1{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.wx{background:var(--surface);border-radius:14px;box-shadow:var(--sh-2);padding:9px 12px;display:flex;align-items:center;gap:8px;flex:0 0 auto;width:112px;margin-top:-16px;overflow:hidden}
.wx>div:first-child{min-width:0;flex:1}
.wx .t{font-size:18px;font-weight:600;line-height:1;letter-spacing:-.02em}
.wx .c{font-size:10.5px;color:var(--ink-2);margin-top:3px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx .src{font-size:9px;color:var(--ink-3);margin-top:1px}
.wx .i{font-size:24px;line-height:1;flex:0 0 auto;width:28px;text-align:center}
.desc{color:var(--ink-2);font-size:14px;line-height:1.55;margin:12px 0 20px}
.stats{display:flex;margin-bottom:20px}
.stat{flex:1;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:16px;margin-left:12px}
.stat .v{font-size:16px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.tips{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(var(--pad) * -1);padding:6px var(--pad) 10px}
.tips::-webkit-scrollbar{display:none}
.tip{flex:0 0 100%;scroll-snap-align:center;background:var(--surface);border-radius:999px;box-shadow:var(--sh-2);padding:14px 22px 14px 14px;display:flex;gap:12px;align-items:center;min-height:64px}
.orb{display:block;flex:0 0 26px;width:26px;height:26px;border-radius:999px;background:radial-gradient(circle at 34% 28%,#CFFBD9 0%,#5DD68A 38%,#1FA35A 72%,#147A42 100%);box-shadow:0 0 0 5px rgba(64,196,110,.12),0 0 16px rgba(64,196,110,.45)}
.orb.k-wear{background:radial-gradient(circle at 34% 28%,#E6DEFF,#9B86F0 38%,#6A4FD8 72%,#4A34B0);box-shadow:0 0 0 5px rgba(124,108,224,.12),0 0 16px rgba(124,108,224,.4)}
.orb.k-food{background:radial-gradient(circle at 34% 28%,#FFE6CC,#FCAF62 38%,#EE7F2A 72%,#B85A14);box-shadow:0 0 0 5px rgba(245,158,66,.12),0 0 16px rgba(245,158,66,.4)}
.orb.k-shop{background:radial-gradient(circle at 34% 28%,#FFDDEB,#F58AB7 38%,#E4508A 72%,#B12C64);box-shadow:0 0 0 5px rgba(236,90,147,.12),0 0 16px rgba(236,90,147,.4)}
.orb.k-gem{background:radial-gradient(circle at 34% 28%,#FFF3C4,#F3C74C 38%,#D9A520 72%,#A0770C);box-shadow:0 0 0 5px rgba(217,165,32,.12),0 0 16px rgba(217,165,32,.4)}
.tip p{margin:0;font-size:12.5px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tip p b{color:var(--ink);font-weight:600}
.tip.x p{-webkit-line-clamp:unset}
.tip.x{border-radius:26px}
.dots{display:flex;justify-content:center;gap:4px;margin:0 0 26px}
.dots i{width:5px;height:5px;border-radius:999px;background:#DADAD6}.dots i.on{background:var(--ink)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sechead h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.015em}
.sechead .cnt{font-size:12px;font-weight:500;color:var(--ink);background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
.sechead .cnt svg{width:12px;height:12px;color:var(--ink-3)}

/* ============ timeline ============ */
.tl{position:relative;padding-left:40px}
.tl::before{content:"";position:absolute;left:14px;top:20px;bottom:30px;width:1.5px;background:#E6E6E3}
.stop{position:relative;margin-bottom:10px}
.ic{position:absolute;left:-40px;top:16px;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 3px var(--ring)}
.ic svg{width:14px;height:14px}
.card{display:block;width:100%;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden}
.card .bd{padding:13px 14px 13px;position:relative}
.card .nm{font-size:14.5px;font-weight:600;line-height:1.35;letter-spacing:-.01em;padding-right:24px}
.more .img{height:150px;border-radius:10px;margin-bottom:12px}
.chev{position:absolute;right:12px;top:14px;width:16px;height:16px;color:var(--ink-3);transition:transform .2s}
.stop.open .chev{transform:rotate(180deg)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;font-weight:600;letter-spacing:.01em;padding:3px 8px;border-radius:999px;line-height:1.3}
.tag.must{background:#FDEBE6;color:#C3432A}.tag.booked{background:#FBF1D3;color:#8F6A0C}.tag.halal{background:#E4F5EA;color:#1E7A45}.tag.opt{background:var(--tint);color:var(--ink-3)}.tag.now{background:var(--ink);color:#fff}
.meta{display:flex;gap:12px;margin-top:7px;font-size:12px;color:var(--ink-3);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.meta .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta svg{width:13px;height:13px;flex:0 0 auto}
.more{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stop.open .more{display:block}
.why{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:0}
.sec{margin-top:12px}
.sec .h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sec .h svg{width:14px;height:14px;color:var(--ink-3)}
.sec ul{margin:0;padding:0;list-style:none}
.sec li{font-size:13px;color:var(--ink-2);line-height:1.45;padding:2px 0 2px 13px;position:relative}
.sec li::before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:999px;background:#CFCFCA}
.sec.tipbox{background:#FBF7EA;border-radius:12px;padding:10px 12px;margin-top:14px}
.sec.tipbox .h svg{color:#C9961C}.sec.tipbox li::before{background:#D9A520}
.mapbtn{display:inline-flex;align-items:center;gap:7px;margin-top:14px;height:44px;padding:0 16px;font-size:13px;font-weight:600;color:var(--ink);background:var(--tint);border-radius:999px}
.mapbtn svg{width:12px;height:12px}
.stop.done .card{opacity:.55}
.ess h3{font-size:14px;font-weight:600;margin:24px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:7px 11px;background:var(--surface);box-shadow:var(--sh-1);border-radius:999px;color:var(--ink);line-height:1.3}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 18px);width:min(60%,260px);height:50px;border-radius:999px;background:#1B1B1B;color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.24);z-index:50}
.cta .d{width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.cta .d svg{width:13px;height:13px}

/* ============ stays / moves ============ */
.stay{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);margin-bottom:10px;overflow:hidden}
.stay .img{height:150px}
.stay .bd{padding:13px 14px 14px}
.stay .line{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.4}
.stay .line svg{width:13px;height:13px;flex:0 0 auto;margin-top:3px;color:var(--ink-3)}
.stay .acts{display:flex;gap:8px;flex-wrap:wrap}
.stay .acts .mapbtn{margin-top:12px}
.stay .ic2{width:34px;height:34px;border-radius:999px;background:var(--c-hotel);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--c-hotel) 22%,var(--bg))}
.stay .ic2 svg{width:16px;height:16px}
.stay .t{font-size:14.5px;font-weight:600;line-height:1.3}
.stay .k{font-size:12px;color:var(--ink-3);margin-top:2px}
.stay .n{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.mv .row{display:flex;gap:12px;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.mv .ic2{width:28px;height:28px;border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.mv .ic2 svg{width:14px;height:14px}
.mv .t{font-size:14px;font-weight:600;line-height:1.3}
.mv .k{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mv .h{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.st{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px}
.st.booked{background:#E4F5EA;color:#1E7A45}.st.tobook{background:#FBF1D3;color:#8F6A0C}.st.suica{background:var(--tint);color:var(--ink-2)}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{font-size:13px;color:var(--ink-2);line-height:1.45;padding:6px 0 6px 14px;position:relative;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border-bottom:0}
ul.plain li::before{content:"";position:absolute;left:0;top:13px;width:4px;height:4px;border-radius:999px;background:#CFCFCA}

/* ============ desktop ============ */
.aside{padding:0 var(--pad) calc(var(--sab) + 100px)}
@media (min-width:900px){
  .app{max-width:none;background:var(--bg)}
  .ov{max-width:1120px;margin:0 auto;padding:0 40px 60px}
  .ov-top{padding-top:44px}
  .cover{height:300px}
  .ov-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
  .day-grid{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(0,1.1fr) 320px;min-height:100vh;gap:0}
  .hero{position:sticky;top:0;height:100vh;max-height:none;min-height:0}
  .hero .cap{bottom:56px}
  .sheet{margin-top:0;border-radius:0;padding:28px 44px 80px;max-width:720px}
  .dsw{position:static;margin:0 0 20px;padding:0;border-radius:0}
  .aside{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 32px 40px 0;border-left:1px solid var(--line);margin-left:0}
  .aside .ess{padding-left:32px}
  .aside .ess h3:first-child{margin-top:0}
  .cta{position:static;transform:none;width:100%;margin:28px 0 0 32px;width:calc(100% - 32px)}
  .aside .cta{display:flex}
  .titlerow h1{font-size:34px}
  .wx{width:150px;padding:11px 14px}
  .wx .t{font-size:20px}
  .wx .c{font-size:11.5px}
  .desc{font-size:15px}
  .tip{min-height:70px}
}

/* ---------- helpers ---------- */
function mkImg(key,cls){
  const d=document.createElement('div');d.className='img '+(cls||'');
  const ph=PH[key];const direct=DIRECT[key];const file=(key&&!ph&&!direct)?IMG_DIR+key+'.jpg':'';
  d.innerHTML=`<div class="ph">${I.photo}${file?`<small>${file}</small>`:''}</div>`;
  const src=ph?phUrl(ph[0],cls==='cover'||cls==='hero'?1400:800):(direct||file);
  if(src){const i=new Image();i.onload=()=>{d.style.backgroundImage=`url("${src}")`;d.classList.add('loaded');if(ph)d.insertAdjacentHTML('beforeend',`<a class="credit" href="https://unsplash.com/@${ph[2]}?utm_source=japan2026&utm_medium=referral" target="_blank" rel="noopener">${ph[1]} / Unsplash</a>`);};i.src=src;}
  return d;
}
function jstNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));}
function todayId(){const n=jstNow();if(n.getFullYear()!==2026||n.getMonth()!==9)return null;const id='oct'+String(n.getDate()).padStart(2,'0');return DAYS.find(x=>x.id===id)?id:null;}
function nowStopIndex(day){if(day.id!==todayId())return -1;const n=jstNow();const cur=n.getHours()*60+n.getMinutes();let idx=-1;day.stops.forEach((s,i)=>{const[h,m]=s.t.split(':').map(Number);if(h*60+m<=cur)idx=i;});return idx;}

  const MI={flight:['✈',I.train],train:['',I.train],shinkansen:['',I.train],car:['',I.car]};const MC={flight:'var(--c-booked)',train:'var(--c-transport)',shinkansen:'var(--c-transport)',car:'var(--c-nature)'};
  document.getElementById('stays').innerHTML='';STAYS.forEach(x=>{const d=document.createElement('div');d.className='stay';d.innerHTML=`<div class="bd"><div class="t">${x.name}</div><div class="k">${x.city} · ${x.range} · ${x.nights} nights</div><div class="line">${I.pin}<span>${x.addr}</span></div><div class="line">${I.train}<span>${x.station}</span></div><div class="n">${x.note}</div><div class="acts">${x.q?`<a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.q)}" target="_blank" rel="noopener">Open in Maps ${I.ext}</a>`:''}${x.link?`<a class="mapbtn" href="${x.link}" target="_blank" rel="noopener">Airbnb listing ${I.ext}</a>`:''}</div></div>`;d.prepend(mkImg(x.img));document.getElementById('stays').appendChild(d);});
  const stl={booked:'<span class="st booked">Booked</span>','to book':'<span class="st tobook">To book</span>',suica:'<span class="st suica">Suica</span>'};
  document.getElementById('moves').innerHTML=MOVES.map(x=>`<div class="row"><div class="ic2" style="background:${MC[x.mode]}">${x.mode==='car'?I.car:I.train}</div><div><div class="t">${x.from} → ${x.to}</div><div class="k">${x.d}${x.t?' · '+x.t:''} ${stl[x.st]||''}</div><div class="h">${x.how}</div></div></div>`).join('');
  document.getElementById('getting').innerHTML=GETTING.map(g=>`<li>${g}</li>`).join('');
  const list=document.getElementById('daylist');const tid=todayId();
  DAYS.forEach(day=>{
    const b=document.createElement('button');b.className='daycard';b.onclick=()=>openDay(day.id);
    const must=day.stops.filter(s=>s.must).length;
    b.innerHTML=`<div class="txt"><div class="k">Day ${String(day.n).padStart(2,'0')} · ${day.short}</div><div class="t">${day.title}</div><div class="meta-row"><span>${I.pin}${day.stops.length} stops</span>${must?`<span>${I.star}${must} must-see</span>`:''}<span>${day.mode==='driving'?I.car:I.sun}${day.mode==='driving'?'Road trip':day.wx.t+'°'}</span></div></div>${day.id===tid?'<span class="today">Today</span>':''}`;
    b.appendChild(mkImg(day.hero[0]));list.appendChild(b);
  });
  const notes=document.getElementById('notes');
  NOTES.forEach(n=>{const d=document.createElement('details');d.className='note';const body=n.html||n.chk.map(c=>`<label class="chk"><input type="checkbox"><span>${c}</span></label>`).join('');d.innerHTML=`<summary>${n.t}${I.chev}</summary><div class="body">${body}</div>`;notes.appendChild(d);});
  const keys=Object.keys(P).filter(k=>P[k][0]!==''&&!PH[k]);const il=document.getElementById('imgList');if(il)il.innerHTML=keys.map(k=>`<li>${IMG_DIR}${k}.jpg <span style="color:var(--ink-3)">(${k==='cover'?'trip cover photo':P[k][0]})</span></li>`).join('');
}

/* ---------- weather ---------- */
const WMO={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorm','⛈️']};
async function weather(day){
  const box=document.getElementById('dWx');
  box.innerHTML=`<div><div class="t">${day.wx.t}°</div><div class="c">${day.wx.c}</div><div class="src">estimate</div></div><div class="i">${day.wx.i}</div>`;
  const date='2026-10-'+day.id.slice(3);
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.wx.ll[0]}&longitude=${day.wx.ll[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&start_date=${date}&end_date=${date}`);
    const j=await r.json();if(!j.daily||j.daily.temperature_2m_max[0]==null||curDay!==day)return;
    const w=WMO[j.daily.weathercode[0]]||['Mixed','🌤️'];const pp=j.daily.precipitation_probability_max[0];
    box.innerHTML=`<div><div class="t">${Math.round(j.daily.temperature_2m_max[0])}°</div><div class="c">${w[0]}${pp!=null?', '+pp+'% rain':''}</div><div class="src">low ${Math.round(j.daily.temperature_2m_min[0])}° · live</div></div><div class="i">${w[1]}</div>`;}catch(e){}
}

/* ---------- day detail ---------- */
let curDay=null;
const sec=(label,icon,arr,cls)=>(!arr||!arr.length)?'':`<div class="sec ${cls||''}"><div class="h">${icon}${label}</div><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
function openDay(id){
  const day=DAYS.find(d=>d.id===id);if(!day)return;
  const switching=curDay&&document.getElementById('day').classList.contains('active');curDay=day;
  document.getElementById('overview').classList.remove('active');document.getElementById('day').classList.add('active');
  if(switching){const top=document.querySelector('.sheet').offsetTop-4;window.scrollTo(0,Math.min(window.scrollY,top));}else window.scrollTo(0,0);
  const gal=document.getElementById('gal');gal.innerHTML='';day.hero.forEach(k=>gal.appendChild(mkImg(k,'hero')));
  const gd=document.getElementById('gdots');gd.innerHTML=day.hero.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  const cap=document.getElementById('cap');const setCap=i=>{const k=day.hero[i];cap.innerHTML=`<div class="k">${i+1} of ${day.hero.length}</div><div class="n">${P[k]?P[k][0]:''}</div>`;[...gd.children].forEach((d,j)=>d.classList.toggle('on',j===i));};
  const gi=()=>Math.max(0,Math.min(day.hero.length-1,Math.round(gal.scrollLeft/gal.clientWidth)));const go=n=>gal.scrollTo({left:Math.max(0,Math.min(day.hero.length-1,n))*gal.clientWidth,behavior:'smooth'});
  const arr=()=>{document.getElementById('gprev').disabled=gi()===0;document.getElementById('gnext').disabled=gi()===day.hero.length-1;};
  setCap(0);gal.scrollLeft=0;gal.onscroll=()=>{setCap(gi());arr();};arr();
  document.getElementById('gprev').onclick=()=>go(gi()-1);document.getElementById('gnext').onclick=()=>go(gi()+1);
  document.onkeydown=e=>{if(!document.getElementById('day').classList.contains('active'))return;if(e.key==='ArrowRight')go(gi()+1);if(e.key==='ArrowLeft')go(gi()-1);};
  const sw=document.getElementById('dsw');sw.innerHTML=DAYS.map(d=>`<button class="${d.id===day.id?'on':''}" onclick="openDay('${d.id}')" aria-label="${d.d}"><small>${d.short.split(' ')[0]}</small><b>${d.short.split(' ')[1]}</b></button>`).join('');
  const onb=sw.querySelector('.on');if(onb)requestAnimationFrame(()=>{sw.scrollLeft=onb.offsetLeft-sw.clientWidth/2+onb.offsetWidth/2;});
  document.getElementById('dayPill').textContent=`Day ${String(day.n).padStart(2,'0')} of ${DAYS.length}`;
  document.getElementById('dDate').textContent=day.d;
  document.getElementById('dTitle').textContent=day.title;
  document.getElementById('dDesc').textContent=day.desc;
  document.getElementById('dStats').innerHTML=[...day.stats,[String(day.stops.length),'Planned stops']].map(s=>`<div class="stat"><div class="v">${s[0]}</div><div class="l">${s[1]}</div></div>`).join('');
  const tips=document.getElementById('dTips');tips.innerHTML=day.tips.map(t=>`<div class="tip" role="button" tabindex="0"><span class="orb k-${t.k}"></span><p><b>${t.h}</b>${t.t?' '+t.t:''}</p></div>`).join('');tips.querySelectorAll('.tip').forEach(el=>el.onclick=()=>el.classList.toggle('x'));
  const dots=document.getElementById('dDots');dots.innerHTML=day.tips.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');tips.scrollLeft=0;
  tips.onscroll=()=>{const i=Math.round(tips.scrollLeft/tips.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));};
  const nowIdx=nowStopIndex(day);
  document.getElementById('dCnt').innerHTML=I.star+day.stops.filter(s=>s.must).length+' must-see';
  const tl=document.getElementById('dStops');tl.innerHTML='';
  day.stops.forEach((s,i)=>{
    const place=s.p&&P[s.p]?P[s.p][0]:'';
    const st=document.createElement('div');st.className='stop'+(i<nowIdx?' done':'');
    const tags=[i===nowIdx?'<span class="tag now">Now</span>':'',s.must?'<span class="tag must">Must see</span>':'',s.cat==='booked'?'<span class="tag booked">Booked</span>':'',s.halal?'<span class="tag halal">Halal</span>':'',s.opt?'<span class="tag opt">Optional</span>':''].filter(Boolean).join('');
    const maps=place?`<a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Open in Maps ${I.ext}</a>`:'';
    const more=`${s.m?`<p class="why">${s.m}</p>`:''}${sec('See',I.eye,s.see)}${sec('Eat',I.food,s.eat)}${sec('Buy',I.bag,s.buy)}${sec('Insider tip',I.bulb,s.tip,'tipbox')}${maps}`;
    st.innerHTML=`<div class="ic" style="background:${CATC[s.cat]};--ring:color-mix(in srgb,${CATC[s.cat]} 22%,var(--bg))">${I[CATI[s.cat]]}</div><button class="card" aria-expanded="false"><div class="bd"><span class="chev">${I.chev}</span><div class="nm">${s.n}</div>${tags?`<div class="tags">${tags}</div>`:''}<div class="meta"><span>${I.clock}${s.t}</span>${place?`<span class="pl">${I.pin}${place}</span>`:''}</div><div class="more">${more}</div></div></button>`;
    if(s.p==='hotel')st.querySelector('.more').prepend(mkImg('tokyohotel'));else if(s.p==='airbnb')st.querySelector('.more').prepend(mkImg('kyotoapt'));else if(s.key&&s.p&&P[s.p][0]!=='')st.querySelector('.more').prepend(mkImg(s.p));
    st.querySelector('.card').onclick=e=>{if(e.target.closest('a'))return;st.classList.toggle('open');st.querySelector('.card').setAttribute('aria-expanded',st.classList.contains('open'));};
    tl.appendChild(st);
  });
  const e=day.ess;
  document.getElementById('dEss').innerHTML=`<h3>Wear today</h3><div class="chips">${e.wear.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Eat</h3><div class="chips">${e.eat.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>Buy here</h3><div class="chips">${e.buy.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
  const pts=[];const seen=new Set();day.stops.forEach(s=>{if(s.p&&P[s.p]&&P[s.p][0]!==''&&!seen.has(s.p)){seen.add(s.p);pts.push(P[s.p][0]);}});
  const cta=document.getElementById('cta');
  if(pts.length>=2){const w=pts.slice(1,-1).slice(0,9);cta.href=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pts[0])}&destination=${encodeURIComponent(pts[pts.length-1])}${w.length?'&waypoints='+encodeURIComponent(w.join('|')):''}&travelmode=${day.mode}`;cta.style.display='flex';document.getElementById('ctaTxt').textContent=day.id===todayId()?"Start today's route":'Open route in Maps';}else cta.style.display='none';
  weather(day);location.hash=day.id;
}
document.getElementById('backBtn').onclick=()=>{document.getElementById('day').classList.remove('active');document.getElementById('overview').classList.add('active');window.scrollTo(0,0);history.replaceState(null,'',' ');};
renderOverview();
const h0=location.hash.replace('#','');if(h0&&DAYS.find(d=>d.id===h0))openDay(h0);
</script>
</body>
